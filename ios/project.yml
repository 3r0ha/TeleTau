# XcodeGen: `cd ios && xcodegen generate` → TeleTau.xcodeproj (в репозиторий не коммитится, см. .gitignore).
name: TeleTau

options:
  bundleIdPrefix: ru.teletau
  # Сборка без -configuration (xcodebuild -target TeleTau …) — Debug: в Release пакеты SPM собираются в свои
  # каталоги, и модули зависимостей (HTTPTypes, DesignSystem) не находятся.
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  TeleTauCore:
    path: Packages/TeleTauCore

targets:
  TeleTau:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TeleTau
    dependencies:
      - package: TeleTauCore
        product: TeleTauFeatures
    info:
      path: TeleTau/Info.plist
      properties:
        # Адрес API по умолчанию — из настроек сборки (TELETAU_API_BASE_URL); на устройстве его меняют на старте
        # (шестерёнка → «Адрес сервера»). Адрес сайта для «Я учитель» — TELETAU_WEB_URL, пусто — тот же хост, порт 3000.
        TeleTauAPIBaseURL: $(TELETAU_API_BASE_URL)
        TeleTauWebURL: $(TELETAU_WEB_URL)
        NSCameraUsageDescription: Камера нужна, чтобы прочитать QR-код карточки ученика.
        NSLocalNetworkUsageDescription: Приложение подключается к учебному серверу в этой сети.
        NSPhotoLibraryAddUsageDescription: Чтобы сохранить картинку с карточкой входа в Фото.
        # Демо и разработка: API в локальной сети по http (http://192.168.x.x:4000). Публичные адреса — только https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Значок — файлами TeleTau/AppIcon/*.png (ios/scripts/import-illustrations.sh): каталог AppIcon actool без
        # рантайма симулятора под iphonesimulator не собирает.
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60]
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60, AppIcon76x76, AppIcon83.5x83.5]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.teletau.app
        PRODUCT_NAME: TeleTau
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # Имя на устройстве — CFBundleDisplayName. CFBundleName при GENERATE_INFOPLIST_FILE всегда равен PRODUCT_NAME
        # (TeleTau — имя .app и бинарника) и значение из Info.plist не перекрывает.
        # needs_native_review: docs/native-review-queue.md, строка 1 (бренд «ТелеТау»).
        INFOPLIST_KEY_CFBundleDisplayName: "ТелеТау"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
        TELETAU_API_BASE_URL: "http://localhost:4000"
        TELETAU_WEB_URL: ""
        # Подпись: в CI и при сборке под симулятор — CODE_SIGNING_ALLOWED=NO. На свой iPhone — Xcode → Signing &
        # Capabilities → Team (бесплатный Apple ID), см. docs/demo/M2-ios.md.
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
