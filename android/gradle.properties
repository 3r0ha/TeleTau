org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

android.useAndroidX=true
# Unit-тесты для всех типов сборки: их требует задача Compose Preview в AGP 9.5 (см. build-logic, configureCompose).
android.onlyEnableUnitTestForTheTestedBuildType=false
kotlin.code.style=official

# Roborazzi: имена снапшотов — относительно roborazzi.outputDir (src/test/snapshots).
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
