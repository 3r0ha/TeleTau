<!doctype html>
<!--
  ПРОТОТИП (одноразовый код). Вопрос, на который он отвечает:
  «Каким должен быть визуальный язык Кәрәҙ, чтобы он был на уровне Duolingo, но со своим лицом?»
  Три принципиально разные главные (?variant=A|B|C) + общий кликабельный урок, результат, серия, лига, класс.
  Палитра здесь — кандидат в дизайн-токены, поэтому цвета заданы прямо в файле.
  Башкирские тексты НЕ проверены носителем (docs/native-review-queue.md).
-->
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Кәрәҙ — прототип визуального направления</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --honey: #ffb703; --honey-d: #e39400; --honey-l: #fff2c9; --honey-xl: #fffaeb; --honey-ink: #4a2c00;
    --green: #43c35e; --green-d: #2c9c45; --green-l: #ddf7e3;
    --blue: #1ca7f2; --blue-d: #128bd0; --blue-l: #dff3ff;
    --red: #ff5a5a; --red-d: #e03e3e; --red-l: #ffe3e3;
    --purple: #9b5cff; --purple-d: #7c3fe0; --purple-l: #efe5ff;
    --orange: #ff8a00; --orange-d: #e06f00;
    --ink: #3c3c3c; --ink-2: #777; --ink-3: #afafaf;
    --line: #e5e5e5; --line-d: #cfcfcf; --soft: #f7f7f7; --bg: #fff;
    --bee: #3b2716;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Nunito", system-ui, sans-serif; font-weight: 700; color: var(--ink);
    background: radial-gradient(circle at 20% 10%, #fff7df 0, transparent 40%), radial-gradient(circle at 80% 90%, #e8f6ff 0, transparent 45%), #efece6;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 20px 0 96px; }
  .phone {
    width: min(390px, calc(100vw - 28px)); height: 844px; max-height: calc(100vh - 116px); background: var(--bg);
    border-radius: 44px; overflow: hidden; position: relative; display: flex; flex-direction: column;
    box-shadow: 0 0 0 10px #1d1b18, 0 30px 80px rgba(40, 30, 10, .35);
  }
  @media (max-width: 460px) {
    .stage { padding: 0 0 84px; place-items: stretch; }
    .phone { width: 100vw; height: calc(100dvh - 84px); max-height: none; border-radius: 0; box-shadow: none; }
  }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
  .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }

  /* ---------- кнопки «нажимные» ---------- */
  .btn {
    --b: var(--honey); --bd: var(--honey-d); --c: var(--honey-ink);
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px;
    border: 0; border-radius: 16px; background: var(--b); color: var(--c); box-shadow: 0 4px 0 var(--bd);
    font-weight: 900; font-size: 15px; letter-spacing: .06em; text-transform: uppercase;
    transition: transform .06s, box-shadow .06s, filter .15s;
  }
  .btn:hover { filter: brightness(1.04); }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--bd); }
  .btn.green { --b: var(--green); --bd: var(--green-d); --c: #fff; }
  .btn.blue { --b: var(--blue); --bd: var(--blue-d); --c: #fff; }
  .btn.red { --b: var(--red); --bd: var(--red-d); --c: #fff; }
  .btn.purple { --b: var(--purple); --bd: var(--purple-d); --c: #fff; }
  .btn.white { --b: #fff; --bd: var(--line-d); --c: var(--blue); border: 2px solid var(--line); }
  .btn.white-on { --b: #fff; --bd: rgba(0,0,0,.18); --c: var(--green-d); }
  .btn:disabled { --b: var(--line); --bd: var(--line); --c: var(--ink-3); cursor: default; transform: none; filter: none; }
  .btn.sm { min-height: 40px; font-size: 13px; border-radius: 12px; }

  /* ---------- верхняя панель ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 12px; border-bottom: 2px solid var(--line); background: #fff; }
  .stat { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 17px; }
  .stat svg { width: 28px; height: 28px; }
  .stat.streak { color: var(--orange); } .stat.honey { color: var(--honey-d); } .stat.league { color: var(--purple); }

  /* ---------- нижняя навигация ---------- */
  .tabbar { display: flex; justify-content: space-around; padding: 8px 10px 14px; border-top: 2px solid var(--line); background: #fff; }
  .tab { border: 2px solid transparent; background: none; border-radius: 14px; padding: 6px 10px; display: grid; place-items: center; }
  .tab svg { width: 32px; height: 32px; }
  .tab.on { background: var(--blue-l); border-color: #8fd3fb; }

  /* ---------- маскот ---------- */
  .bee { display: block; }
  .bee .wing { transform-box: fill-box; transform-origin: bottom center; animation: flap .22s ease-in-out infinite alternate; }
  .bob { animation: bob 2.6s ease-in-out infinite; }
  @keyframes flap { from { transform: scaleY(1) } to { transform: scaleY(.84) } }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }

  /* ---------- A · ТРОПА ---------- */
  .unit-banner { position: sticky; top: 0; z-index: 3; margin: 12px 16px; border-radius: 16px; background: var(--green); color: #fff; display: flex; overflow: hidden; box-shadow: 0 4px 0 var(--green-d); }
  .unit-banner .t { flex: 1; padding: 14px 16px; }
  .unit-banner .k { font-size: 13px; font-weight: 900; letter-spacing: .08em; opacity: .85; text-transform: uppercase; }
  .unit-banner .n { font-size: 20px; font-weight: 900; margin-top: 2px; }
  .unit-banner .g { width: 64px; display: grid; place-items: center; border-left: 2px solid rgba(0,0,0,.12); }
  .unit-banner .g svg { width: 30px; height: 30px; }
  .path { position: relative; padding: 18px 0 40px; }
  .node-row { position: relative; height: 98px; display: flex; justify-content: center; }
  .node-row.cur { margin-top: 34px; height: 104px; }
  .node {
    --c: var(--green); --cd: var(--green-d);
    position: relative; width: 74px; height: 68px; border-radius: 50%; border: 0; background: var(--c); box-shadow: 0 7px 0 var(--cd);
    display: grid; place-items: center; transition: transform .08s;
  }
  .node:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--cd); }
  .node svg { width: 36px; height: 36px; }
  .node.honey { --c: var(--honey); --cd: var(--honey-d); }
  .node.purple { --c: var(--purple); --cd: var(--purple-d); }
  .node.locked { --c: var(--line); --cd: var(--line-d); }
  .node.current::before { content: ""; position: absolute; inset: -12px; border-radius: 50%; background: conic-gradient(var(--green) 0 40%, var(--line) 40% 100%); z-index: -1; -webkit-mask: radial-gradient(circle, transparent 47px, #000 48px); mask: radial-gradient(circle, transparent 47px, #000 48px); }
  .start-bubble { position: absolute; bottom: calc(100% + 20px); left: 50%; transform: translateX(-50%); background: #fff; color: var(--green); border: 2px solid var(--line); border-radius: 12px; padding: 8px 14px; font-weight: 900; letter-spacing: .06em; font-size: 15px; white-space: nowrap; animation: hop 1.4s ease-in-out infinite; }
  .start-bubble::after { content: ""; position: absolute; top: 100%; left: 50%; width: 14px; height: 14px; background: #fff; border: 2px solid var(--line); border-top: 0; border-left: 0; transform: translate(-50%, -7px) rotate(45deg); }
  @keyframes hop { 0%, 100% { transform: translate(-50%, 0) } 50% { transform: translate(-50%, -6px) } }
  .popover { position: absolute; top: calc(100% + 18px); left: 50%; transform: translateX(-50%); width: 300px; background: var(--green); color: #fff; border-radius: 18px; padding: 16px; z-index: 5; box-shadow: 0 4px 0 var(--green-d); animation: pop .18s ease-out; }
  .popover::before { content: ""; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); border: 10px solid transparent; border-bottom-color: var(--green); }
  .popover h4 { margin: 0 0 2px; font-size: 18px; font-weight: 900; } .popover p { margin: 0 0 14px; opacity: .9; }
  @keyframes pop { from { transform: translateX(-50%) scale(.9); opacity: 0 } to { transform: translateX(-50%) scale(1); opacity: 1 } }
  .unit-divider { display: flex; align-items: center; gap: 12px; margin: 26px 24px 18px; color: var(--ink-3); font-weight: 900; font-size: 15px; }
  .unit-divider::before, .unit-divider::after { content: ""; flex: 1; height: 2px; background: var(--line); }
  .path-bee { position: absolute; width: 110px; }

  /* ---------- B · СОТЫ ---------- */
  .hello { display: flex; align-items: center; gap: 10px; padding: 16px 20px 4px; }
  .bubble { position: relative; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; font-size: 15px; }
  .bubble::before { content: ""; position: absolute; left: -9px; top: 50%; width: 14px; height: 14px; background: #fff; border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateY(-50%) rotate(45deg); }
  .section-title { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 20px 8px; }
  .section-title h3 { margin: 0; font-size: 20px; font-weight: 900; }
  .section-title span { color: var(--ink-2); font-weight: 800; }
  .hexwrap { filter: drop-shadow(0 5px 0 var(--hd, var(--honey-d))); }
  .hex { clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); display: grid; place-items: center; }
  .hexp { clip-path: polygon(50% 0, 96% 25%, 96% 75%, 50% 100%, 4% 75%, 4% 25%); display: grid; place-items: center; }
  .flower { position: relative; width: 236px; height: 222px; margin: 6px auto 0; }
  .flower .cell { position: absolute; width: 78px; height: 72px; }
  .flower .cell .hexwrap { width: 100%; height: 100%; }
  .flower .cell .hex { width: 100%; height: 100%; background: #ececec; }
  .flower .cell.done .hex { background: linear-gradient(180deg, #ffd25a, var(--honey)); }
  .flower .cell.done .hexwrap { --hd: var(--honey-d); }
  .flower .cell.empty .hexwrap { --hd: var(--line-d); }
  .flower .cell.now .hexwrap { --hd: var(--blue-d); animation: pulse 1.6s ease-in-out infinite; }
  .flower .cell.now .hex { background: var(--blue); }
  .flower .cell svg { width: 30px; height: 30px; }
  @keyframes pulse { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
  .skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 4px; padding: 6px 18px 0; }
  .skills .s { display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 13px; font-weight: 800; }
  .skills .s:nth-child(3n+2) { transform: translateY(26px); }
  .skills .hexwrap { --hd: var(--line-d); }
  .skills .hex { width: 92px; height: 84px; background: linear-gradient(0deg, var(--honey) var(--f), #fff4cf var(--f)); }
  .skills .hex.locked { background: var(--soft); }
  .skills .hex svg { width: 32px; height: 32px; }
  .card { margin: 0 16px 14px; border: 2px solid var(--line); border-radius: 20px; padding: 16px; background: #fff; }
  .bar { height: 16px; border-radius: 99px; background: var(--line); overflow: hidden; position: relative; }
  .bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--honey); }
  .bar > i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 9px; background: rgba(255,255,255,.45); }
  .avatars { display: flex; margin-top: 12px; }
  .avatars > div { width: 40px; height: 40px; margin-right: -8px; border-radius: 50%; border: 3px solid #fff; display: grid; place-items: center; }
  .sticky-cta { position: sticky; bottom: 0; padding: 12px 16px 14px; background: linear-gradient(180deg, rgba(255,255,255,0), #fff 30%); }

  /* ---------- C · ЭКСПЕДИЦИЯ ---------- */
  .hero { margin: 14px 16px; border-radius: 24px; overflow: hidden; position: relative; color: #fff; box-shadow: 0 5px 0 #1e6e3a; }
  .hero .art { height: 210px; display: block; width: 100%; }
  .hero .over { position: absolute; left: 18px; top: 16px; right: 18px; }
  .hero .k { font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }
  .hero h2 { margin: 2px 0 0; font-size: 28px; font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .hero .foot { background: #2c9c45; padding: 14px 16px 16px; }
  .hero .foot .bar { background: rgba(255,255,255,.3); height: 14px; } .hero .foot .bar > i { background: #fff; }
  .wordle { display: flex; gap: 6px; margin: 12px 0 14px; }
  .wordle .hexp { width: 40px; height: 44px; background: var(--honey); color: var(--honey-ink); font-weight: 900; font-size: 18px; }
  .wordle .hexp.blank { background: #fff3cf; }
  .carousel { display: flex; gap: 12px; overflow-x: auto; padding: 4px 16px 18px; scrollbar-width: none; }
  .carousel::-webkit-scrollbar { display: none; }
  .place { flex: 0 0 138px; border-radius: 20px; padding: 12px; color: #fff; min-height: 170px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 5px 0 var(--pd); }
  .place svg { width: 46px; height: 46px; }
  .place b { font-size: 17px; font-weight: 900; display: block; } .place small { opacity: .9; font-weight: 800; }
  .place .bar { height: 10px; background: rgba(255,255,255,.35); margin-top: 8px; } .place .bar > i { background: #fff; }
  .place.locked { filter: grayscale(1) opacity(.45); }
  .duel-mini { display: grid; gap: 8px; margin: 12px 0 14px; }
  .duel-mini > div { border: 2px solid #d9c7ff; border-radius: 14px; padding: 10px 12px; background: #fff; font-weight: 900; color: var(--purple-d); }
  .rank { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-radius: 14px; }
  .rank .pos { width: 26px; text-align: center; font-weight: 900; color: var(--ink-2); }
  .rank .name { flex: 1; font-weight: 800; }
  .rank .pts { font-weight: 900; color: var(--ink-2); }
  .rank.me { background: var(--honey-l); }
  .ava { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; }

  /* ---------- урок ---------- */
  .lesson-top { display: flex; align-items: center; gap: 14px; padding: 18px 18px 8px; }
  .x { border: 0; background: none; padding: 4px; display: grid; } .x svg { width: 26px; height: 26px; }
  .pbar { flex: 1; height: 18px; border-radius: 99px; background: var(--line); position: relative; overflow: hidden; }
  .pbar > i { position: absolute; inset: 0 auto 0 0; background: var(--green); border-radius: 99px; transition: width .4s cubic-bezier(.3,1.4,.5,1); }
  .pbar > i::after { content: ""; position: absolute; left: 10px; right: 10px; top: 5px; height: 5px; border-radius: 9px; background: rgba(255,255,255,.35); }
  .combo { color: var(--orange); font-weight: 900; display: flex; align-items: center; gap: 2px; } .combo svg { width: 22px; height: 22px; }
  .lesson-body { flex: 1; padding: 8px 20px 0; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  .ex-kind { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--purple); margin-bottom: 4px; }
  .ex-title { font-size: 25px; font-weight: 900; margin: 0 0 14px; line-height: 1.15; }
  .speaker { display: flex; align-items: flex-end; gap: 6px; margin-bottom: 18px; }
  .speaker .bubble { font-size: 19px; font-weight: 800; padding: 12px 16px; }
  .answer-lines { min-height: 112px; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding: 10px 0; background: linear-gradient(transparent 54px, var(--line) 54px, var(--line) 56px, transparent 56px); }
  .bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px; }
  .tile { border: 2px solid var(--line); border-radius: 14px; background: #fff; padding: 10px 14px; font-size: 18px; font-weight: 800; box-shadow: 0 3px 0 var(--line-d); transition: transform .05s; }
  .tile:active { transform: translateY(3px); box-shadow: none; }
  .tile.ghost { background: var(--line); color: transparent; box-shadow: none; border-color: var(--line); pointer-events: none; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .choice { border: 2px solid var(--line); border-radius: 18px; background: #fff; padding: 16px 10px; box-shadow: 0 4px 0 var(--line-d); display: grid; justify-items: center; gap: 8px; font-size: 18px; font-weight: 800; }
  .choice .em { font-size: 44px; line-height: 1; }
  .choice.sel { border-color: #84d8ff; background: var(--blue-l); color: var(--blue-d); box-shadow: 0 4px 0 #84d8ff; }
  .input { width: 100%; min-height: 120px; border: 2px solid var(--line); border-radius: 18px; background: var(--soft); padding: 14px; font: inherit; font-size: 20px; font-weight: 800; resize: none; outline: none; }
  .input:focus { border-color: #84d8ff; background: #fff; }
  .letters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .letters button { width: 38px; height: 42px; border: 2px solid var(--line); border-radius: 10px; background: #fff; font-size: 19px; font-weight: 900; box-shadow: 0 3px 0 var(--line-d); }
  .letters button:active { transform: translateY(3px); box-shadow: none; }
  .duel-card { border: 2px solid var(--line); border-radius: 18px; background: #fff; padding: 16px; box-shadow: 0 4px 0 var(--line-d); display: flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 900; width: 100%; text-align: left; margin-bottom: 12px; }
  .duel-card .tag { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 15px; color: var(--ink-2); flex: 0 0 auto; }
  .duel-card.sel { border-color: #c7a6ff; background: var(--purple-l); color: var(--purple-d); box-shadow: 0 4px 0 #c7a6ff; }
  .duel-card.sel .tag { border-color: #c7a6ff; color: var(--purple-d); }
  .duel-alt { display: flex; gap: 10px; }
  .duel-alt button { flex: 1; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 10px; font-weight: 800; color: var(--ink-2); box-shadow: 0 3px 0 var(--line-d); }
  .duel-alt button.sel { border-color: #c7a6ff; background: var(--purple-l); color: var(--purple-d); }
  .lesson-foot { padding: 14px 18px 22px; border-top: 2px solid var(--line); }
  .sheet { padding: 18px 18px 22px; animation: slide .22s ease-out; }
  @keyframes slide { from { transform: translateY(100%) } to { transform: translateY(0) } }
  .sheet.ok { background: var(--green-l); color: var(--green-d); }
  .sheet.bad { background: var(--red-l); color: var(--red-d); }
  .sheet.almost { background: var(--honey-l); color: #a86800; }
  .sheet.vote { background: var(--purple-l); color: var(--purple-d); }
  .sheet .head { display: flex; align-items: center; gap: 10px; font-size: 23px; font-weight: 900; }
  .sheet .head .ico { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .sheet .head .ico svg { width: 26px; height: 26px; }
  .sheet p { margin: 8px 0 14px; font-size: 16px; font-weight: 800; }
  .sheet mark { background: #fff; color: inherit; border-radius: 6px; padding: 0 4px; }

  /* ---------- результат / серия ---------- */
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; gap: 10px; }
  .big-title { font-size: 30px; font-weight: 900; color: var(--honey-d); margin: 0; }
  .stats { display: flex; gap: 10px; width: 100%; margin-top: 10px; }
  .statcard { flex: 1; border: 2px solid var(--sc); border-radius: 16px; overflow: hidden; background: var(--sc); }
  .statcard .h { color: #fff; font-size: 12px; font-weight: 900; letter-spacing: .08em; padding: 5px 0; }
  .statcard .v { background: #fff; border-radius: 13px; padding: 12px 0; font-size: 22px; font-weight: 900; color: var(--sc); display: flex; align-items: center; justify-content: center; gap: 4px; }
  .statcard .v svg { width: 22px; height: 22px; }
  .contrib { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 2px solid #d9c7ff; background: var(--purple-l); color: var(--purple-d); border-radius: 18px; padding: 12px 14px; margin-top: 4px; }
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(900px) rotate(720deg); } }
  .streak-num { font-size: 96px; font-weight: 900; color: var(--orange); line-height: 1; }
  .week { display: flex; gap: 6px; margin: 14px 0 6px; }
  .week .d { display: grid; justify-items: center; gap: 4px; font-size: 13px; font-weight: 900; color: var(--ink-2); }
  .week .hexwrap { --hd: var(--line-d); } .week .on .hexwrap { --hd: var(--orange-d); }
  .week .hex { width: 40px; height: 36px; background: var(--line); } .week .on .hex { background: var(--orange); }
  .week .hex svg { width: 18px; height: 18px; }

  /* ---------- лига / класс ---------- */
  .tiers { display: flex; justify-content: center; gap: 10px; padding: 18px 16px 6px; }
  .tiers .hexwrap { --hd: var(--line-d); opacity: .45; }
  .tiers .on .hexwrap { opacity: 1; --hd: #b07a00; transform: scale(1.18); }
  .tiers .hexp { width: 48px; height: 54px; font-size: 24px; }
  .zone { display: flex; align-items: center; gap: 8px; margin: 6px 20px; font-size: 13px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
  .zone::before, .zone::after { content: ""; flex: 1; height: 2px; }
  .zone.up { color: var(--green-d); } .zone.up::before, .zone.up::after { background: var(--green-l); }
  .zone.down { color: var(--red-d); } .zone.down::before, .zone.down::after { background: var(--red-l); }

  /* ---------- переключатель прототипа (не часть дизайна) ---------- */
  .proto-bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 4px; background: #111; color: #fff; border-radius: 999px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.35); font-family: ui-monospace, Menlo, monospace; font-weight: 600; font-size: 13px; }
  .proto-bar button { border: 0; background: #2a2a2a; color: #fff; border-radius: 999px; width: 34px; height: 34px; font-size: 16px; }
  .proto-bar button:hover { background: #3a3a3a; }
  .proto-bar .lbl { padding: 0 12px; min-width: 190px; text-align: center; }
  .proto-bar .lbl small { display: block; color: #9a9a9a; font-size: 10px; }
</style>
</head>

      <div class="path-bee bob" style="right:14px;top:70px;width:96px">${bee(96)}</div>
      <div class="foot"><div class="bar"><i style="width:62%"></i></div><div style="height:12px"></div><button class="btn white-on" data-action="start">Продолжить путь</button></div></div>
    <div class="card" style="background:#fffaeb;border-color:#ffe08a">
      <div style="display:flex;justify-content:space-between"><b style="font-size:18px">Фраза дня №214</b><span style="color:#e39400;font-weight:900">осталось 9 ч</span></div>
      <div style="color:#8a6a2a;margin-top:4px">Переведи и сравни с классом — как в Wordle</div>
      <div class="wordle" lang="ba">${["Х", "", "", "", "", "Ң"].map((l) => `<div class="hexp ${l ? "" : "blank"}">${l}</div>`).join("")}</div>
      <button class="btn sm" data-action="start">Решить</button></div>
    <div class="section-title"><h3>Места экспедиции</h3><span>2 / 12</span></div>
    <div class="carousel">${places.map(([n, ba, ic, c, cd, p, lk]) => `<div class="place ${lk ? "locked" : ""}" style="background:${c};--pd:${cd}">${ic}<div><b>${n}</b><small lang="ba">${ba}</small><div class="bar"><i style="width:${p}%"></i></div></div></div>`).join("")}</div>
    <div class="card" style="background:#f7f1ff;border-color:#d9c7ff">
      <div style="display:flex;align-items:center;gap:8px;color:#7c3fe0;font-weight:900">${I.heartP}<span style="font-size:18px">Помоги языку</span></div>
      <div style="color:#6b4fa3;margin-top:4px">3 дуэли ждут твоего голоса. Голоса учеников собирают базу переводов.</div>
      <div class="duel-mini" lang="ba"><div>A · Хәйерле көн</div><div>B · Яҡшы көн</div></div>
      <button class="btn purple sm" data-action="duel">Голосовать</button></div>
    <div class="card"><div style="display:flex;justify-content:space-between"><b style="font-size:18px">Лига Гречихи</b><span style="color:#777">3 дня</span></div>
      ${LEAGUE.slice(0, 4).map(rankRow).join("")}
    </div>
  </div>${tabbar()}</div>`;
}
function rankRow([n, p, c, me], k) {
  return `<div class="rank ${me ? "me" : ""}"><span class="pos">${k + 1}</span><div class="ava" style="background:${c}">${I.navMe(true).replace("#3b2716", c === "#3b2716" ? "#3b2716" : c)}</div><span class="name">${n}</span><span class="pts">${p} бал</span></div>`;
}

/* ===================== ЛИГА ===================== */
function league() {
  const tiers = [["🍀", "Клевер"], ["🌾", "Гречиха"], ["🌼", "Донник"], ["🌸", "Кипрей"], ["🌳", "Липа"]];
  return `<div class="screen">${topbar()}<div class="scroll">
    <div class="tiers">${tiers.map(([e], k) => `<div class="${k === 1 ? "on" : ""}"><div class="hexwrap"><div class="hexp" style="background:${k === 1 ? "#ffd25a" : "#e5e5e5"}">${e}</div></div></div>`).join("")}</div>
    <div style="text-align:center;padding:8px 20px 4px"><div style="font-size:24px;font-weight:900">Лига Гречихи</div><div style="color:#777">Топ-3 переходят в «Донник» · осталось 3 дня</div></div>
    <div style="padding:6px 14px">${LEAGUE.slice(0, 3).map(rankRow).join("")}</div>
    <div class="zone up">зона повышения</div>
    <div style="padding:6px 14px">${LEAGUE.slice(3, 7).map((r, k) => rankRow(r, k + 3)).join("")}</div>
    <div class="zone down">зона понижения</div>
    <div style="padding:6px 14px 20px">${LEAGUE.slice(7).map((r, k) => rankRow(r, k + 7)).join("")}</div>
  </div>${tabbar()}</div>`;
}

/* ===================== КЛАСС ===================== */
function classHive() {
  const ring = [0, 45, 90, 135, 180, 225, 270, 315].map((a) => `<path d="M60 60 L60 18 L68 30 L60 42 L52 30 Z" fill="${a % 90 ? "#ffb703" : "#ff8a00"}" transform="rotate(${a} 60 60)"/>`).join("");
  return `<div class="screen">${topbar()}<div class="scroll">
    <div style="text-align:center;padding:20px 20px 6px">
      <svg width="150" height="150" viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="#fff2c9"/>${ring}<circle cx="60" cy="60" r="13" fill="#3b2716"/><path d="M60 50l8 10-8 10-8-10z" fill="#ffb703"/></svg>
      <div style="font-size:24px;font-weight:900">Улей 5Б</div><div style="color:#777">Тамга класса растёт с каждым квестом</div></div>
    <div class="card"><b style="font-size:18px">Квест недели</b><p style="margin:6px 0 10px;color:#777">Запечатать 300 ячеек всем классом</p><div class="bar"><i style="width:71%"></i></div><div style="text-align:right;color:#e39400;font-weight:900;margin-top:6px">212 / 300</div></div>
    <div class="card"><b style="font-size:18px">Звёзды недели</b>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">${["⚡ Самая длинная серия", "🎯 Чуткое ухо", "🍯 Больше всех мёда", "🤝 Помог языку"].map((t) => `<span style="background:#f7f7f7;border:2px solid #e5e5e5;border-radius:12px;padding:6px 10px;font-weight:800">${t}</span>`).join("")}</div></div>
    <div class="card"><b style="font-size:18px">Битва районов</b><p style="margin:6px 0 0;color:#777">Бурзянский район · 3-е место среди сельских школ</p></div>
  </div>${tabbar()}</div>`;
}

/* ===================== УРОК ===================== */
function lesson() {
  const ex = EXERCISES[S.step];
  const pct = (S.step / EXERCISES.length) * 100;
  let body = "";
  if (ex.type === "tiles") {
    body = `<div class="speaker">${bee(78)}<div class="bubble">${ex.prompt}</div></div>
      <div class="answer-lines" lang="ba">${S.picked.map((w, k) => `<button class="tile" data-unpick="${k}">${w}</button>`).join("")}</div>
      <div class="bank" lang="ba">${ex.bank.map((w) => `<button class="tile ${S.picked.includes(w) ? "ghost" : ""}" data-pick="${w}">${w}</button>`).join("")}</div>`;
  } else if (ex.type === "choice") {
    body = `<div class="choices">${ex.options.map(([em, t], k) => `<button class="choice ${S.choice === k ? "sel" : ""}" data-choice="${k}"><span class="em">${em}</span>${t}</button>`).join("")}</div>`;
  } else if (ex.type === "input") {
    body = `<div class="speaker">${bee(78, "think")}<div class="bubble">${ex.prompt}</div></div>
      <textarea class="input" id="inp" lang="ba" placeholder="Напиши по-башкирски" ${S.sheet ? "disabled" : ""}>${S.input}</textarea>
      <div class="letters" lang="ba">${"әөүғҡңҙҫһ".split("").map((l) => `<button data-letter="${l}">${l}</button>`).join("")}</div>
      <div style="color:#afafaf;font-size:13px;margin-top:8px">Нет башкирской клавиатуры? Жми на буквы выше.</div>`;
  } else {
    body = `<button class="duel-card ${S.duel === "a" ? "sel" : ""}" data-duel="a"><span class="tag">A</span><span lang="ba">${ex.a}</span></button>
      <button class="duel-card ${S.duel === "b" ? "sel" : ""}" data-duel="b"><span class="tag">B</span><span lang="ba">${ex.b}</span></button>
      <div class="duel-alt"><button class="${S.duel === "both" ? "sel" : ""}" data-duel="both">Оба верны</button><button class="${S.duel === "unsure" ? "sel" : ""}" data-duel="unsure">Не уверен</button></div>
      <div style="color:#777;font-size:14px;margin-top:14px">Правильного ответа здесь нет — твой голос помогает собрать проверенную базу переводов.</div>`;
  }
  const ready = ex.type === "tiles" ? S.picked.length > 0 : ex.type === "choice" ? S.choice !== null : ex.type === "input" ? S.input.trim().length > 0 : S.duel !== null;
  const foot = S.sheet ? sheet(ex) : `<div class="lesson-foot"><button class="btn ${ex.type === "duel" ? "purple" : "green"}" data-action="check" ${ready ? "" : "disabled"}>${ex.type === "duel" ? "Отдать голос" : "Проверить"}</button></div>`;
  return `<div class="screen">
    <div class="lesson-top"><button class="x" data-action="quit" aria-label="Выйти">${I.close}</button><div class="pbar"><i style="width:${Math.max(pct, 4)}%"></i></div><span class="combo">${I.flame}${S.correct}</span></div>
    <div class="lesson-body">
      <div class="ex-kind" style="color:${ex.type === "duel" ? "#7c3fe0" : "#1ca7f2"}">${ex.type === "duel" ? I.heartP.replace('viewBox="0 0 32 32"', 'viewBox="0 0 32 32" width="18" height="18"') : "✦"} ${ex.kind}</div>
      <h2 class="ex-title">${ex.title}</h2>
      ${body}
    </div>
    ${foot}
  </div>`;
}
function sheet(ex) {
  const s = S.sheet;
  const conf = {
    ok: ["ok", I.checkG, "Отлично!", "", "green"],
    bad: ["bad", I.cross, "Неправильно", `Правильный ответ: <mark lang="ba">${s.answer || ""}</mark>`, "red"],
    almost: ["almost", I.bang, "Почти!", `Обрати внимание на букву <mark lang="ba">${ex.hintLetter}</mark>: правильно <mark lang="ba">${ex.answer}</mark>`, ""],
    vote: ["vote", I.heartP, "Голос учтён!", "Мёд созреет, когда соберутся голоса. Бал за голос придёт завтра 🍯", "purple"],
  }[s.kind];
  return `<div class="sheet ${conf[0]}"><div class="head"><span class="ico">${conf[1]}</span>${conf[2]}</div><p>${conf[3]}</p><button class="btn ${conf[4]}" data-action="next">Продолжить</button></div>`;
}

/* ===================== РЕЗУЛЬТАТ и СЕРИЯ ===================== */
function result() {
  const sec = S.startedAt ? Math.max(1, Math.round((Date.now() - S.startedAt) / 1000)) : 84;
  const acc = S.startedAt ? Math.round((S.correct / 3) * 100) : 100;
  const conf = Array.from({ length: 46 }, () => `<i style="left:${Math.random() * 100}%;background:${["#ffb703", "#43c35e", "#1ca7f2", "#ff5a5a", "#9b5cff"][Math.floor(Math.random() * 5)]};animation-duration:${1.4 + Math.random() * 1.6}s;animation-delay:${Math.random() * .5}s"></i>`).join("");
  return `<div class="screen"><div class="confetti">${conf}</div><div class="center">
    <div class="bob">${bee(160, "cheer")}</div>
    <h1 class="big-title">Урок пройден!</h1>
    <div class="stats">
      <div class="statcard" style="--sc:#ffb703"><div class="h">БАЛ</div><div class="v">${I.honey}+15</div></div>
      <div class="statcard" style="--sc:#43c35e"><div class="h">ТОЧНОСТЬ</div><div class="v">${acc}%</div></div>
      <div class="statcard" style="--sc:#1ca7f2"><div class="h">ВРЕМЯ</div><div class="v">${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}</div></div>
    </div>
    <div class="contrib">${hexCell("", "", "width:44px;height:40px;background:linear-gradient(0deg,#ffb703 35%,#fff2c9 35%)")}<div><b>1 ячейка созревает</b><div style="font-weight:700;font-size:14px">Твой голос в дуэли пополнит базу переводов</div></div></div>
  </div><div class="lesson-foot" style="border:0"><button class="btn" data-action="streak">Продолжить</button></div></div>`;
}
function streak() {
  const days = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
  return `<div class="screen"><div class="center">
    <div class="bob" style="width:120px">${I.flame.replace("<svg", '<svg width="120" height="120"')}</div>
    <div class="streak-num">7</div><div style="font-size:24px;font-weight:900;color:#ff8a00">дней подряд!</div>
    <div class="week">${days.map((d, k) => `<div class="d ${k < 3 ? "on" : ""}">${d}<div class="hexwrap"><div class="hex">${k < 3 ? I.check : ""}</div></div></div>`).join("")}</div>
    <div class="card" style="margin:10px 0 0;width:100%;text-align:left">❄️ <b>Заморозка серии:</b> 2 в запасе. Каникулы и выходные по школьному календарю серию не сбрасывают.</div>
  </div><div class="lesson-foot" style="border:0"><button class="btn" data-action="home">Продолжить</button></div></div>`;
}

/* ===================== рендер и события ===================== */
function render() {
  const homeByVariant = { A: homeA, B: homeB, C: homeC };
  let html;
  if (S.screen === "lesson") html = lesson();
  else if (S.screen === "result") html = result();
  else if (S.screen === "streak") html = streak();
  else if (S.tab === "league") html = league();
  else if (S.tab === "class") html = classHive();
  else html = homeByVariant[S.variant]();
  app.innerHTML = html;
  document.getElementById("vlabel").textContent = `${S.variant} · ${VARIANTS[S.variant]}`;
  const inp = document.getElementById("inp");
  if (inp && !S.sheet) { inp.addEventListener("input", (e) => { S.input = e.target.value; const b = app.querySelector('[data-action="check"]'); if (b) b.disabled = !S.input.trim(); }); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  if (S.screen === "home" && S.tab === "home" && S.variant === "A") { const sc = document.getElementById("sc"); if (sc && !S.popover) sc.scrollTop = 120; }
  syncUrl();
}
const fold = (s) => s.toLowerCase().trim().replace(/[!.,?]/g, "").replace(/ә/g, "а").replace(/ө/g, "о").replace(/ү/g, "у").replace(/ғ/g, "г").replace(/ҡ/g, "к").replace(/ң/g, "н").replace(/ҙ/g, "з").replace(/ҫ/g, "с").replace(/һ/g, "х");
function check() {
  const ex = EXERCISES[S.step];
  if (ex.type === "tiles") S.sheet = S.picked.join(" ") === ex.answer.join(" ") ? { kind: "ok" } : { kind: "bad", answer: ex.answer.join(" ") };
  else if (ex.type === "choice") S.sheet = S.choice === ex.answer ? { kind: "ok" } : { kind: "bad", answer: ex.options[ex.answer][1] };
  else if (ex.type === "input") {
    const v = S.input.toLowerCase().trim().replace(/[!.,?]/g, "").replace(/h/g, "һ");
    S.sheet = v === ex.answer ? { kind: "ok" } : fold(v) === fold(ex.answer) ? { kind: "almost" } : { kind: "bad", answer: ex.answer };
  } else S.sheet = { kind: "vote" };
  if (S.sheet.kind === "ok") S.correct++;
  render();
}
function startLesson() { Object.assign(S, { screen: "lesson", step: 0, picked: [], choice: null, input: "", duel: null, sheet: null, correct: 0, startedAt: Date.now(), popover: false }); render(); }

app.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-action]"); if (!t) return;
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab === "duel" ? "home" : d.tab; S.popover = false; if (d.tab === "duel") { startLesson(); S.step = 3; render(); } else render(); return; }
  if (d.pick) { if (!S.sheet && !S.picked.includes(d.pick)) S.picked.push(d.pick); render(); return; }
  if (d.unpick !== undefined) { if (!S.sheet) S.picked.splice(+d.unpick, 1); render(); return; }
  if (d.choice !== undefined) { if (!S.sheet) S.choice = +d.choice; render(); return; }
  if (d.duel) { if (!S.sheet) S.duel = d.duel; render(); return; }
  if (d.letter) { if (!S.sheet) S.input += d.letter; render(); return; }
  switch (d.action) {
    case "pop": S.popover = !S.popover; render(); break;
    case "start": startLesson(); break;
    case "duel": startLesson(); S.step = 3; render(); break;
    case "check": check(); break;
    case "next": S.sheet = null; S.picked = []; S.choice = null; S.input = ""; S.duel = null; if (S.step < EXERCISES.length - 1) { S.step++; render(); } else { S.screen = "result"; render(); } break;
    case "streak": S.screen = "streak"; render(); break;
    case "home": case "quit": S.screen = "home"; S.tab = "home"; render(); break;
  }
});
const cycle = (dir) => { const keys = Object.keys(VARIANTS); S.variant = keys[(keys.indexOf(S.variant) + dir + keys.length) % keys.length]; S.screen = "home"; S.tab = "home"; S.popover = false; render(); };
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.getElementById("home").onclick = () => { S.screen = "home"; S.tab = "home"; render(); };
document.addEventListener("keydown", (e) => { if (e.target.closest("input, textarea, [contenteditable]")) return; if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1); });
if (["league", "class"].includes(S.screen)) { S.tab = S.screen; S.screen = "home"; }
if (S.screen === "lesson") {
  startLesson();
  /* для скриншотов: ?screen=lesson&step=2&input=рахмат&sheet=1 */
  if (params.get("step")) { S.step = +params.get("step"); S.input = params.get("input") || ""; if (params.get("sheet")) { check(); } else render(); }
} else { S.screen = ["result", "streak"].includes(S.screen) ? S.screen : "home"; render(); }
</script>
</body>
</html>
