          type: array
          description: Уроки и «Испытания места» открытых юнитов в порядке тропы
          items:
            $ref: "#/components/schemas/AssignmentOption"
    StudentAssignment:
      type: object
      description: Задание учителя на тропе ученика
      required: [id, kind, titleRu, dueOn, done]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AssignmentKind"
        lessonId:
          type: string
          description: Узел тропы — его можно начать (`POST /lessons/{lessonId}/runs`); у `review` нет — `POST /reviews/runs`
        titleRu:
          type: string
        placeRu:
          type: string
        dueOn:
          type: string
          format: date
          description: Последний день по Уфе (включительно)
        done:
          type: boolean
          description: Ученик уже выполнил задание

    # ── consensus ──
    DuelVariant:
      type: object
      required: [variantId, text]
      properties:
        variantId:
          type: string
          format: uuid
        text:
          type: string
          description: Башкирский вариант (`lang="ba"`)
    CorpusDuel:
      type: object
      required: [itemId, sourceRu, variants, review]
      properties:
        itemId:
          type: string
          format: uuid
        sourceRu:
          type: string
        variants:
          type: array
          description: Два варианта в случайном порядке
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/DuelVariant"
        review:
          $ref: "#/components/schemas/ReviewStatus"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceCitation"
    CorpusDuelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CorpusDuel"
    JudgmentRequest:
      type: object
      additionalProperties: false
      required: [judgmentId, itemId, shown, choice]
      properties:
        judgmentId:
          type: string
          format: uuid
          description: Клиентский UUIDv7 голоса; повтор с ним возвращает тот же ответ
        itemId:
          type: string
          format: uuid
        shown:
          type: array
          description: "`variantId` в порядке показа: A, B"
          minItems: 2
          maxItems: 2
          items:
            type: string
            format: uuid
        choice:
          $ref: "#/components/schemas/DuelChoice"
        latencyMs:
          type: integer
          minimum: 0
          maximum: 3600000
    ItemStatus:
      type: string
      description: "Статус исходника по duel-v0 (ADR 0019): `voting` — идёт голосование, `accepted` — вариант принят, `escalated` — нужен эксперт"
      enum: [voting, accepted, escalated]
    VariantTag:
      type: string
      description: "`children_prefer` — большинство детей выбрало этот вариант, а итог — другой (docs/03 §4a)"
      enum: [children_prefer]
    VotedVariant:
      type: object
      required: [variantId, text, accepted, main, tags]
      properties:
        variantId:
          type: string
          format: uuid
        text:
          type: string
        accepted:
          type: boolean
        main:
          type: boolean
          description: Основной вариант (выбор старших групп или эксперта)
        tags:
          type: array
          items:
            $ref: "#/components/schemas/VariantTag"
    VariantVotes:
      type: object
      required: [variantId, votes]
      properties:
        variantId:
          type: string
          format: uuid
        votes:
          type: integer
          minimum: 0
    GroupTally:
      type: object
      description: Голоса одной группы
      required: [total, both, skip, variants]
      properties:
        total:
          type: integer
          minimum: 0
        both:
          type: integer
          minimum: 0
          description: «Оба подходят»
        skip:
          type: integer
          minimum: 0
          description: «Не знаю»
        variants:
          type: array
          items:
            $ref: "#/components/schemas/VariantVotes"
    GroupTallies:
      type: object
      required: [child, teacher, adult]
      properties:
        child:
          $ref: "#/components/schemas/GroupTally"
        teacher:
          $ref: "#/components/schemas/GroupTally"
        adult:
          $ref: "#/components/schemas/GroupTally"
    MyVote:
      type: object
      required: [choice, votedAt]
      properties:
        choice:
          $ref: "#/components/schemas/DuelChoice"
        variantId:
          type: string
          format: uuid
          description: Выбранный вариант (для `a` и `b`)
        votedAt:
          type: string
          format: date-time
    CorpusItemVotes:
      type: object
      required: [itemId, sourceRu, status, variants, groups, rulesVersion]
      properties:
        itemId:
          type: string
          format: uuid
        sourceRu:
          type: string
        status:
          $ref: "#/components/schemas/ItemStatus"
        decidedBy:
          type: string
          description: Кто принял решение (нет — решения ещё нет)
          enum: [rule, expert]
        variants:
          type: array
          items:
            $ref: "#/components/schemas/VotedVariant"
        groups:
          $ref: "#/components/schemas/GroupTallies"
        myVote:
          $ref: "#/components/schemas/MyVote"
        rulesVersion:
          type: string
          examples: [duel-v0]
    CellStatus:
      type: string
      description: "`pending` — ждёт решения (мёд «созревает»); `matured` — созрело, мёд начислен; `none` — «Не знаю», без мёда"
      enum: [pending, matured, none]
    MyCell:
      type: object
      required: [itemId, sourceRu, choice, status, honey, votedAt]
      properties:
        itemId:
          type: string
          format: uuid
        sourceRu:
          type: string
        choice:
          $ref: "#/components/schemas/DuelChoice"
        chosen:
          $ref: "#/components/schemas/BaString"
        status:
          $ref: "#/components/schemas/CellStatus"
        honey:
          type: integer
          minimum: 0
          description: Мёд за голос — `pending` (3) или начисленный (3 или 1)
        agreed:
          type: boolean
          description: Совпал ли голос с итогом (только у `matured`)
        votedAt:
          type: string
          format: date-time
        maturedAt:
          type: string
          format: date-time
    CellsSummary:
      type: object
      required: [matured, pending, honeyFinal, honeyPending]
      properties:
        matured:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        honeyFinal:
          type: integer
          minimum: 0
        honeyPending:
          type: integer
          minimum: 0
    MyCellsPage:
      type: object
      required: [summary, items]
      properties:
        summary:
          $ref: "#/components/schemas/CellsSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyCell"
        nextCursor:
          type: string

    # ── telegram (ADR 0020) ──
    TelegramChatIdValue:
      type: string
      description: |
        Идентификатор личного чата с ботом (`chat.id` = `user.id` Telegram, до 52 значащих бит) — десятичной строкой,
        чтобы не терять точность в клиентах. Групповые чаты (отрицательные id) не привязываются.
      pattern: "^[1-9][0-9]{0,15}$"
      examples: ["279058397"]
    TelegramReminderHour:
      type: integer
      description: Час напоминания по Уфе (UTC+5). Только вне тихих часов детей 21:00–08:00 (docs/02 §8)
      minimum: 8
      maximum: 20
      examples: [18]
    TelegramReminders:
      type: object
      description: Напоминание о серии — раз в день, если серия под угрозой; включается только по согласию в боте
      required: [enabled, hour]
      properties:
        enabled:
          type: boolean
        hour:
          $ref: "#/components/schemas/TelegramReminderHour"
    TelegramLinkRequest:
      type: object
      additionalProperties: false
      required: [initData]
      properties:
        initData:
          type: string
          description: |
            `Telegram.WebApp.initData` (параметр `tgWebAppData` адреса запуска) как есть — строка запроса с подписью
            `hash`. Не логируется; из неё сохраняется только `user.id`.
          minLength: 1
          maxLength: 4096
    TelegramLoginRequest:
      type: object
      description: "Вход по привязанному Telegram: initData проверяется, чат ищется в привязках (POST /auth/telegram)"
      additionalProperties: false
      required: [initData, device]
      properties:
        initData:
          type: string
          description: |
            `Telegram.WebApp.initData` как есть — строка запроса с подписью `hash`. Не логируется; из неё читается
            только `user.id`.
          minLength: 1
          maxLength: 4096
        device:
          $ref: "#/components/schemas/DeviceInfo"
    TelegramLinkCode:
      type: object
      description: |
        Одноразовый код привязки Telegram (10 минут): ученик или взрослый берёт его на сайте и присылает боту
        командой `/start <код>`. Новый код гасит прежний.
      required: [code, expiresAt]
      properties:
        code:
          type: string
          description: 8 знаков без похожих (без 0/O и 1/I)
          pattern: "^[2-9A-HJ-NP-Z]{8}$"
          examples: ["K7Q4MZ2T"]
        expiresAt:
          type: string
          format: date-time
    TelegramLinkCodeRedeemRequest:
      type: object
      additionalProperties: false
      required: [code, chatId]
      properties:
        code:
          type: string
          description: Одноразовый код привязки из профиля на сайте
          pattern: "^[2-9A-HJ-NP-Z]{8}$"
        chatId:
          $ref: "#/components/schemas/TelegramChatIdValue"
    TelegramLink:
      type: object
      description: Привязка создана или обновлена. `chat_id` не возвращается — он не нужен вебу
      required: [reminders]
      properties:
        reminders:
          $ref: "#/components/schemas/TelegramReminders"
    TelegramChat:
      type: object
      description: Привязанный чат — только для бота; аккаунт не раскрывается
      required: [chatId, reminders]
      properties:
        chatId:
          $ref: "#/components/schemas/TelegramChatIdValue"
        reminders:
          $ref: "#/components/schemas/TelegramReminders"
    TelegramRemindersUpdate:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        hour:
          $ref: "#/components/schemas/TelegramReminderHour"
    TelegramReminderTarget:
      type: object
      required: [chatId]
      properties:
        chatId:
          $ref: "#/components/schemas/TelegramChatIdValue"
    TelegramReminderBatch:
      type: object
      required: [day, items]
      properties:
        day:
          type: string
          format: date
          description: Сутки по Уфе, на которые выданы напоминания
        items:
          type: array
          items:
            $ref: "#/components/schemas/TelegramReminderTarget"
    TelegramDuelSide:
      type: object
      description: Вариант дуэли в порядке показа этому диалогу (A, B) — `choice` ответа относительно него
      required: [variantId, text]
      properties:
        variantId:
          type: string
          format: uuid
        text:
          type: string
          description: Башкирский вариант (`lang="ba"`)
    TelegramDailyDuel:
      type: object
      description: |
        Ежедневное задание (FSM в БД, ADR 0024). `state = issued` — диалог выдан: `dialogId` и стороны в порядке
        показа; повторная выдача в эти же сутки возвращает тот же диалог. `done` — голос на эти сутки по Уфе уже
        учтён; `empty` — свежих дуэлей для аккаунта нет. При `state ≠ issued` полей диалога нет.
      required: [state]
      properties:
        state:
          type: string
          description: "issued — дуэль выдана; done — на сегодня всё; empty — нерешённых дуэлей нет"
          enum: [issued, done, empty]
        dialogId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        sourceRu:
          type: string
          description: Исходник на русском
        a:
          $ref: "#/components/schemas/TelegramDuelSide"
        b:
          $ref: "#/components/schemas/TelegramDuelSide"
    TelegramDailyAnswerRequest:
      type: object
      additionalProperties: false
      required: [choice]
      properties:
        choice:
          $ref: "#/components/schemas/DuelChoice"
    TelegramDailyAnswer:
      type: object
      description: Голос учтён (replay — уже был учтён той же кнопкой, новой записи нет). Распределение голосов не отдаётся
      required: [replay, status]
      properties:
        replay:
          type: boolean
        status:
          $ref: "#/components/schemas/ItemStatus"
    TelegramDailyCancel:
      type: object
      required: [cancelled]
      properties:
        cancelled:
          type: boolean
          description: Был ли активный диалог (false — нечего было отменять или повтор)

    # ── ministry: кабинет министерства (ADR 0023) ──
    Suppression:
      type: string
      description: |
        Почему числа скрыты: `small_group` — в группе меньше `smallGroupThreshold` учеников (их нельзя было бы связать
        с конкретным ребёнком); `complementary` — числа скрыты, чтобы скрытую малую группу нельзя было вычислить
        вычитанием из итога
      enum: [small_group, complementary]
    GroupCount:
      type: object
      description: Число учеников группы. Скрыто (`suppression`, без `value`), если группа меньше порога (ADR 0023)
      properties:
        value:
          type: integer
          minimum: 0
        suppression:
          $ref: "#/components/schemas/Suppression"
    LearnerActivity:
      type: object
      description: |
        Числа группы учеников (школа, район, ученики без школы, республика). При `suppression` чисел нет вовсе.
        Неделя — текущая учебная неделя пн–вс по Уфе.
      properties:
        suppression:
          $ref: "#/components/schemas/Suppression"
        students:
          type: integer
          minimum: 0
          description: Учеников с аккаунтом (у школы — на местах действующих классов)
        activeWeek:
          type: integer
          minimum: 0
          description: Занимались на этой неделе (хотя бы один урок)
        lessonsWeek:
          type: integer
          minimum: 0
          description: Уроков и повторений пройдено на этой неделе
        lessonsTotal:
          type: integer
          minimum: 0
          description: Уроков и повторений пройдено всего
    Coverage:
      type: object
      required: [connected, total]
      properties:
        connected:
          type: integer
          minimum: 0
          description: Подключено — есть хотя бы один действующий класс
        total:
          type: integer
          minimum: 0
          description: Всего в справочнике (без демо-записей)
    RepublicWeek:
      type: object
      description: Неделя динамики (пн–вс по Уфе)
      required: [week, lessons, active]
      properties:
        week:
          $ref: "#/components/schemas/Week"
        lessons:
          type: integer
          minimum: 0
          description: Уроков и повторений пройдено за неделю
        active:
          type: integer
          minimum: 0
          description: Учеников, занимавшихся на неделе
    RepublicSummary:
      type: object
      required: [asOf, week, smallGroupThreshold, districts, schools, classes, students, teachersVerified, learners, votes, pairsAccepted, weeks]
      properties:
        asOf:
          type: string
          format: date-time
          description: Момент расчёта
        week:
          $ref: "#/components/schemas/Week"
        smallGroupThreshold:
          type: integer
          minimum: 1
          description: Порог малой группы — меньше этого числа учеников числа не показываются
          examples: [5]
        districts:
          $ref: "#/components/schemas/Coverage"
        schools:
          $ref: "#/components/schemas/Coverage"
        classes:
          type: integer
          minimum: 0
          description: Действующих классов
        students:
          type: object
          description: |
            Ученики школ (на местах действующих классов) и «Учусь сам» без класса (ADR 0022). Группа «Учусь сам» меньше
            порога скрыта и не входит ни в `learners`, ни в итоги районов: иначе её числа получались бы вычитанием.
          required: [school, self]
          properties:
            school:
              $ref: "#/components/schemas/GroupCount"
            self:
              $ref: "#/components/schemas/GroupCount"
        teachersVerified:
          type: integer
          minimum: 0
          description: Учителей с подтверждённой заявкой
        learners:
          $ref: "#/components/schemas/LearnerActivity"
        wordsLearned:
          type: integer
          minimum: 0
          description: Слов выучено (новые слова пройденных уроков) — по тем же ученикам, что `learners`; нет, если они скрыты
        votes:
          type: integer
          minimum: 0
          description: Голосов в «Помоги языку» — все группы, без «Не знаю»
        pairsAccepted:
          type: integer
          minimum: 0
          description: Пар принято в словарь (строк словаря для Фонда)
        weeks:
          type: array
          description: Последние недели по тем же ученикам, что `learners`, от старых к новым; текущая — последняя (неполная). Пусто, если `learners` скрыты
          items:
            $ref: "#/components/schemas/RepublicWeek"
    RepublicDistrictRow:
      type: object
      required: [districtId, nameRu, kind, schools, classes, activity]
      properties:
        districtId:
          type: string
          format: uuid
        nameRu:
          type: string
        kind:
          $ref: "#/components/schemas/DistrictKind"
        isDemo:
          type: boolean
        schools:
          $ref: "#/components/schemas/Coverage"
        classes:
          type: integer
          minimum: 0
        activity:
          $ref: "#/components/schemas/LearnerActivity"
    RepublicDistrictList:
      type: object
      required: [asOf, week, smallGroupThreshold, items, selfLearners, total]
      properties:
        asOf:
          type: string
          format: date-time
        week:
          $ref: "#/components/schemas/Week"
        smallGroupThreshold:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/RepublicDistrictRow"
        selfLearners:
          $ref: "#/components/schemas/LearnerActivity"
        total:
          $ref: "#/components/schemas/LearnerActivity"
          description: Итог — районы и «Учусь сам» (если эта группа не скрыта); совпадает с `learners` сводки
    RepublicSchoolRow:
      type: object
      required: [schoolId, shortNameRu, classes, activity]
      properties:
        schoolId:
          type: string
          format: uuid
        shortNameRu:
          type: string
        isDemo:
          type: boolean
        classes:
          type: integer
          minimum: 0
        activity:
          $ref: "#/components/schemas/LearnerActivity"
    RepublicDistrictDetail:
      type: object
      required: [asOf, week, smallGroupThreshold, district, items, weeks]
      properties:
        asOf:
          type: string
          format: date-time
        week:
          $ref: "#/components/schemas/Week"
        smallGroupThreshold:
          type: integer
          minimum: 1
        district:
          $ref: "#/components/schemas/RepublicDistrictRow"
        items:
          type: array
          description: Подключённые школы района; пусто, если числа района скрыты
          items:
            $ref: "#/components/schemas/RepublicSchoolRow"
        weeks:
          type: array
          description: Динамика района, от старых недель к новым; пусто, если числа района скрыты
          items:
            $ref: "#/components/schemas/RepublicWeek"

    # ── fund: словарь для Фонда (ADR 0023) ──
    SourceKind:
      type: string
      description: "`word` — слово, `phrase` — словосочетание, `sentence` — предложение, `term` — термин"
      enum: [word, phrase, sentence, term]
    VariantOrigin:
      type: string
      description: "Откуда вариант: `import` — из источника (`sources`), `human` — от участника, `mt`/`llm` — машинный (в словарь без проверки носителем не попадает)"
      enum: [human, import, mt, llm]
    FundGroupVotes:
      type: object
      description: Голоса одной группы по исходнику (без «Не знаю»)
      required: [votesFor, both, total]
      properties:
        votesFor:
          type: integer
          minimum: 0
          description: За этот вариант
        both:
          type: integer
          minimum: 0
          description: «Оба подходят»
        total:
          type: integer
          minimum: 0
          description: Всего голосов группы по исходнику
    FundPair:
      type: object
      required: [itemId, variantId, sourceRu, kind, textBa, review, origin, sources, main, tags, votes, decidedAt, decidedBy, rulesVersion, preliminary]
      properties:
        itemId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        sourceRu:
          type: string
          description: Исходник — русский (`ba-ru`) или казахский (`ba-kz`)
        langPair:
          type: string
          enum: [ba-ru, ba-kz]
          description: "Языковая пара: ba-ru — башкирский ← русский, ba-kz — башкирский ← казахский"
        kind:
          $ref: "#/components/schemas/SourceKind"
        textBa:
          type: string
          description: Башкирский вариант в канонической форме `@teletau/bashkir-text`
        review:
          $ref: "#/components/schemas/ReviewStatus"
        origin:
          $ref: "#/components/schemas/VariantOrigin"
        sources:
          type: array
          description: Источник варианта (у `import` — всегда)
          items:
            $ref: "#/components/schemas/SourceCitation"
        main:
          type: boolean
          description: Основной вариант исходника (если приняты оба — один из них)
        tags:
          type: array
          items:
            $ref: "#/components/schemas/VariantTag"
        votes:
          type: object
          required: [child, adult, teacher]
          properties:
            child:
              $ref: "#/components/schemas/FundGroupVotes"
            adult:
              $ref: "#/components/schemas/FundGroupVotes"
            teacher:
              $ref: "#/components/schemas/FundGroupVotes"
        decidedAt:
          type: string
          format: date-time
          description: Момент решения
        decidedBy:
          type: string
          description: "`rule` — по правилам голосования, `expert` — решение эксперта"
          enum: [rule, expert]
        rulesVersion:
          type: string
          examples: [duel-v0]
        preliminary:
          type: boolean
          description: Предварительно, до Consensus Engine — решение по правилам duel-v0, не для релиза датасета (ADR 0019)
    FundDictionary:
      type: object
      required: [generatedAt, items]
      properties:
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/FundPair"
    PhraseOfDay:
      type: object
      description: Фраза дня — принятая пара корпуса для публичной витрины без регистрации (ТЗ §3.6)
      required: [date]
      properties:
        date:
          type: string
          format: date
          description: Учебные сутки по Уфе (Asia/Yekaterinburg), по которым выбрана пара
        pair:
          description: Основной принятый вариант исходника; отсутствует, если принятых пар ещё нет
          type: object
          required: [sourceRu, kind, textBa, sources]
          properties:
            sourceRu:
              type: string
              description: Русский исходник
            kind:
              $ref: "#/components/schemas/SourceKind"
            textBa:
              type: string
              description: Башкирский вариант в канонической форме `@teletau/bashkir-text`
            sources:
              type: array
              description: Источники варианта (у `import` — всегда)
              items:
                $ref: "#/components/schemas/SourceCitation"
    PublicDictionary:
      type: object
      description: |
        Публичный словарь (ТЗ §5): принятые пары для всех без регистрации. Персональных данных нет — только
        тексты, источники и статусы (правило 13). Голосующие не раскрываются. Пары словаря — ba-ru и ba-kz;
        пара каждой строки — в её поле `langPair`.
      required: [generatedAt, langPair, items]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: Момент выгрузки
        langPair:
          type: string
          enum: [ba-ru, ba-kz]
          description: "Основная пара словаря — «башкирский ← русский» (ba-ru): с ней работают лендинг и бот; пары строк — в поле langPair каждой строки"
        items:
          type: array
          description: Принятые пары сверху вниз по времени решения
          items:
            $ref: "#/components/schemas/PublicDictionaryEntry"
    PublicDictionaryEntry:
      type: object
      description: Строка словаря — принятый башкирский вариант исходника (ТЗ §5)
      required: [fragmentId, textBa, langPair, translation, sources, confirmed, status]
      properties:
        fragmentId:
          type: string
          format: uuid
          description: Идентификатор фрагмента — принятого башкирского варианта
        textBa:
          type: string
          description: Башкирский текст в канонической форме `@teletau/bashkir-text`
        langPair:
          type: string
          enum: [ba-ru, ba-kz]
          description: "Языковая пара строки: ba-ru — башкирский ← русский, ba-kz — башкирский ← казахский"
        translation:
          type: string
          description: Исходник — русский (`ba-ru`) или казахский (`ba-kz`)
        sources:
          type: array
          description: Источники фрагмента (у вариантов из источников — всегда)
          items:
            $ref: "#/components/schemas/SourceCitation"
        confirmed:
          type: boolean
          description: "`true` — подтверждено и входит в выпуски датасета; `false` — предварительное решение голосования (duel-v0, ADR 0019), может уточниться"
        status:
          type: string
          enum: [confirmed, expert_review]
          description: "`confirmed` — принято голосованием, `expert_review` — проверено носителем языка"
    PublicLeaderboard:
      type: object
      description: |
        Доска почёта (ТЗ §4.5): топ школ и классов за период. Только агрегаты школ и классов — ни ников, ни имён
        (правило 13). Место — по пройденным урокам; при равенстве выше тот, у кого больше выученных слов.
      required: [asOf, period, periodStart, smallGroupThreshold, schools, classes]
      properties:
        asOf:
          type: string
          format: date-time
          description: Момент расчёта
        period:
          type: string
          enum: [day, week, month, year]
          description: Период доски
        periodStart:
          type: string
          format: date
          description: Начало периода по Уфе (Asia/Yekaterinburg) — сутки, понедельник, 1-е число, 1 января
        smallGroupThreshold:
          type: integer
          minimum: 1
          description: Группы с меньшим числом активных учеников в доску не попадают
          examples: [5]
        schools:
          type: array
          description: Топ школ (до 10)
          items:
            $ref: "#/components/schemas/PublicLeaderboardSchool"
        classes:
          type: array
          description: Топ классов (до 10)
          items:
            $ref: "#/components/schemas/PublicLeaderboardClass"
    PublicLeaderboardSchool:
      type: object
      description: Школа в доске почёта
      required: [rank, school, district, lessons, activeStudents, wordsLearned]
      properties:
        rank:
          type: integer
          minimum: 1
          description: Место
        school:
          type: string
          description: Короткое название школы
        district:
          type: string
          description: Район или городской округ
        lessons:
          type: integer
          minimum: 0
          description: Уроков и повторений пройдено за период
        activeStudents:
          type: integer
          minimum: 1
          description: Учеников занималось за период — не меньше порога малой группы
        wordsLearned:
          type: integer
          minimum: 0
          description: Словарный запас — слов выучено учениками всего (не за период)
    PublicLeaderboardClass:
      type: object
      description: Класс в доске почёта
      required: [rank, school, district, classLabel, lessons, activeStudents, wordsLearned]
      properties:
        rank:
          type: integer
          minimum: 1
          description: Место
        school:
          type: string
          description: Короткое название школы
        district:
          type: string
          description: Район или городской округ
        classLabel:
          type: string
          description: Класс, например «5 «Б»»
        lessons:
          type: integer
          minimum: 0
          description: Уроков и повторений пройдено за период
        activeStudents:
          type: integer
          minimum: 1
          description: Учеников занималось за период — не меньше порога малой группы
        wordsLearned:
          type: integer
          minimum: 0
          description: Словарный запас — слов выучено учениками всего (не за период)
    EscalatedVariant:
      type: object
      description: Вариант спорного исходника с голосами групп за него
      required: [variantId, text, votes]
      properties:
        variantId:
          type: string
          format: uuid
        text:
          type: string
          description: Башкирский вариант (`lang="ba"`)
        review:
          $ref: "#/components/schemas/ReviewStatus"
        origin:
          $ref: "#/components/schemas/VariantOrigin"
        votes:
          type: object
          description: Голоса групп за этот вариант (без «Не знаю»)
          required: [child, adult, teacher]
          properties:
            child:
              $ref: "#/components/schemas/FundGroupVotes"
            adult:
              $ref: "#/components/schemas/FundGroupVotes"
            teacher:
              $ref: "#/components/schemas/FundGroupVotes"
    EscalatedItem:
      type: object
      description: |
        Спорный исходник — нет консенсуса по duel-v0 (ADR 0019). Кандидат на решение эксперта (УФИЦ РАН, ТЗ §4.4):
        в хакатоне список только формируется, решение эксперта — задел на развитие.
      required: [itemId, sourceRu, kind, variants, lastVoteAt]
      properties:
        itemId:
          type: string
          format: uuid
        sourceRu:
          type: string
          description: Русский исходник
        kind:
          $ref: "#/components/schemas/SourceKind"
        variants:
          type: array
          description: Два варианта — по числу голосов каждой группы видно, где раскол
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/EscalatedVariant"
        lastVoteAt:
          type: string
          format: date-time
          description: Последний голос по исходнику
    FundEscalated:
      type: object
      required: [generatedAt, items]
      properties:
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          description: Свежие споры сверху
          items:
            $ref: "#/components/schemas/EscalatedItem"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен (JWT ES256, 15 минут; ADR 0015)
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: |
        Секрет сервиса проекта (сейчас — только Telegram-бот, `BOT_SERVICE_TOKEN`; ADR 0020). Операции с ним — роль
        `service`: без пользователя, access-токен пользователя их не открывает (403).
security:
  - bearerAuth: []
