      summary: Моя лига на этой неделе
      description: |
        Недельная лига медоносов: 5 тиров, группа до 20 участников одной возрастной группы (дети — с детьми).
        Неделя — пн–вс по Уфе; закрывается лениво, при первом запросе новой недели: первые 5 повышаются, последние 3
        понижаются. В группу участник попадает с первыми очками недели — до этого `members` пуст и `me` нет.
        Участники видны только по никам из словаря (взрослые без ника — без `nickname`).
      x-access: { roles: [student, adult] }
      responses:
        "200":
          description: Тир, группа, зоны и итог прошлой недели
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueStanding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/leagues/result-seen:
    post:
      tags: [competition]
      operationId: markLeagueResultSeen
      summary: Итог недели лиги просмотрен
      description: Отмечает итог недели `weekStart` просмотренным — экран «Новая лига» больше не показывается. Повтор безопасен.
      x-access: { roles: [student, adult] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeagueResultSeenRequest"
      responses:
        "204":
          description: Отмечено
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/classes/{id}/hive:
    get:
      tags: [competition]
      operationId: getClassHive
      summary: Улей класса — квест недели и участие
      description: Только агрегаты по классу — без мест, ников и личных результатов. Учитель или ученик этого класса; чужой класс — 403.
      x-access: { roles: [any], policy: class-member }
      parameters:
        - $ref: "#/components/parameters/ClassId"
      responses:
        "200":
          description: Квест и участие класса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassHive"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  # ───────────────────────────── assignments: задания учителя классу (ADR 0021) ─────────────────────────────
  /api/v1/classes/{id}/assignments:
    get:
      tags: [assignments]
      operationId: listClassAssignments
      summary: Задания класса и их выполнение
      description: |
        Активные задания (срок не прошёл; сегодня по Уфе — последний день) и последние пять завершённых — с выполнением
        по номерам мест, без ников и ПДн (ники — в `GET /classes/{id}`). Выполнение засчитывается, когда ученик
        проходит заданный урок или «Испытание места» (пройденные ещё до выдачи — тоже) или, для повторения слов, проходит
        повторение после выдачи: до конца дня срока — `done`, позже — `done_late`; не прошёл — `todo`, а после срока —
        `overdue`. Места — все места с учеником на момент запроса.
        `options` — что можно задать: уроки и «Испытания места» открытых юнитов курса. Только учитель этого класса.
      x-access: { roles: [teacher], policy: class-teacher }
      parameters:
        - $ref: "#/components/parameters/ClassId"
      responses:
        "200":
          description: Задания класса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassAssignments"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Unexpected"
    post:
      tags: [assignments]
      operationId: createClassAssignment
      summary: Дать классу задание
      description: |
        Урок (`lesson`), «Испытание места» (`place_test`) — по `lessonId` узла тропы открытого юнита, — или
        повторение слов (`review`, без `lessonId`) со сроком `dueOn` (дата по Уфе, включительно): от сегодня
        до 28 дней вперёд. У класса одновременно не больше двух активных заданий — иначе 409 `assignment_limit`;
        такое же активное задание уже есть — 409 `assignment_exists`. Неизвестный урок, урок закрытого юнита,
        «Помоги языку» или неподходящий срок — 422 `validation_failed` с указателем на поле. Ученикам класса задание
        видно на тропе (`GET /course` → `assignments`), а заданный урок у них открыт.
        С `Idempotency-Key` повтор возвращает первый результат.
      x-access: { roles: [teacher], policy: class-teacher }
      parameters:
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
      responses:
        "201":
          description: Задание выдано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/classes/{id}/assignments/{assignmentId}:
    delete:
      tags: [assignments]
      operationId: cancelClassAssignment
      summary: Снять задание
      description: |
        Задание пропадает у учеников и у учителя (и активное, и завершённое); выполнение учеников остаётся в их
        прогрессе. Идемпотентно: уже снятое — тоже 204. Задания нет в этом классе — 404. Только учитель этого класса.
      x-access: { roles: [teacher], policy: class-teacher }
      parameters:
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "204":
          description: Задание снято
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  # ───────────────────────────── consensus: дуэли и голоса (правила duel-v0 — ADR 0019) ─────────────────────────────
  /api/v1/corpus/duels:
    get:
      tags: [consensus]
      operationId: listCorpusDuels
      summary: Дуэли «Помогите языку» для взрослого или учителя
      description: |
        Дуэли вне урока: исходники в статусе `voting`, за которые вызывающий ещё не голосовал. Варианты — только из
        человеческих источников (`origin = import`), в случайном порядке. Дети голосуют только в уроке
        (`POST /lesson-runs/{runId}/attempts`).
      x-access: { roles: [adult] }
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
      responses:
        "200":
          description: Дуэли для голоса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusDuelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/corpus/judgments:
    post:
      tags: [consensus]
      operationId: submitCorpusJudgment
      summary: Голос учителя или взрослого в дуэли
      description: |
        Голос пишется в журнал `judgments` (только вставка, правило 9) с группой голосующего (`teacher` —
        подтверждённый учитель, иначе `adult`) и версией правил; состояние исходника пересчитывается по duel-v0
        (ADR 0019). `judgmentId` генерирует клиент (UUIDv7): повтор возвращает тот же ответ. `shown` — варианты
        в порядке показа (A, B), `choice` — относительно них. Ответ — голоса по группам (как `GET /corpus/items/{id}/votes`).
        Уже голосовал за этот исходник — 409 `already_voted`; варианты не этого исходника — 422 `validation_failed`.
      x-access: { roles: [adult] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JudgmentRequest"
      responses:
        "201":
          description: Голос учтён; голоса по группам
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusItemVotes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/corpus/items/{id}/votes:
    get:
      tags: [consensus]
      operationId: getCorpusItemVotes
      summary: Голоса по группам и статус исходника
      description: |
        Раздельно по группам — дети, учителя, взрослые (docs/03 §4a) — и статус по duel-v0. Видно только после
        своего голоса за этот исходник: иначе 403 `vote_required` (защита от конформизма).
      x-access: { roles: [adult] }
      parameters:
        - $ref: "#/components/parameters/CorpusItemId"
      responses:
        "200":
          description: Голоса и статус
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusItemVotes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/corpus/my-cells:
    get:
      tags: [consensus]
      operationId: listMyCorpusCells
      summary: Мой вклад в словарь — созрело и ждёт
      description: |
        Мои голоса в дуэлях, новые сначала: «ждёт» — исходник ещё не решён, мёд за голос `pending`; «созрело» —
        решение принято, мёд начислен (3 при согласии с итогом, 1 при несогласии); «Не знаю» — без мёда.
      x-access: { roles: [student, adult], policy: self }
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Мои голоса и сводка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCellsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  # ───────────────────────────── telegram: привязка чата и бот (ADR 0020) ─────────────────────────────
  /api/v1/telegram/link:
    post:
      tags: [telegram]
      operationId: linkTelegramChat
      summary: Привязать чат Telegram к своему аккаунту (Mini App)
      description: |
        Mini App после входа присылает `initData` как есть — один раз за запуск. API проверяет подпись по алгоритму
        Telegram (HMAC-SHA-256, ключ — HMAC-SHA-256 токена бота с ключом `WebAppData`) и `auth_date` не старше суток.
        Из `initData` берётся только `user.id` — он же `chat_id` личного чата с ботом; имя, ник, фото и прочее не
        сохраняются и не логируются. Повтор безопасен; чат, привязанный к другому аккаунту, переходит к вызывающему.
        Напоминания при привязке не включаются — только по согласию в боте. Подпись не сошлась или строка не разобрана —
        422 `init_data_invalid`; `initData` старше суток — 422 `init_data_expired`; бот не настроен — 503
        `telegram_unavailable`.
      x-access: { roles: [student, adult], policy: self }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramLinkRequest"
      responses:
        "200":
          description: Чат привязан; текущие настройки напоминаний
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/me/telegram/link-code:
    post:
      tags: [telegram]
      operationId: issueTelegramLinkCode
      summary: Одноразовый код привязки Telegram — взять на сайте
      description: |
        Привязка без Mini App: аккаунт берёт на сайте одноразовый код (8 знаков, без похожих 0/O и 1/I) и присылает
        боту командой `/start <код>`. Код живёт 10 минут, хранится в Valkey и одноразовый: выпуск нового гасит
        прежний. Не чаще 1 кода в минуту на аккаунт — дальше 429. Сотрудникам код не положен — 403 (вход в консоль
        по e-mail с TOTP). Сама привязка — той же upsert-семантикой, что `POST /telegram/link`.
      x-access: { roles: [student, adult], policy: self }
      responses:
        "200":
          description: Код выдан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLinkCode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/telegram/bot/chats/link-code/redeem:
    post:
      tags: [telegram]
      operationId: redeemTelegramLinkCode
      summary: Погасить код привязки (служебная, для бота)
      description: |
        Только для бота (`X-Service-Token`): вызывается из `/start <код>`. Код ищется в Valkey и расходуется
        атомарно (нет, истёк или уже использован — 404 `code_not_found`). Привязка — той же upsert-семантикой, что
        `POST /telegram/link`: чат переходит к аккаунту кода, активные дуэли прежнего владельца отменяются (ADR 0024).
        Брут-форс кодов — не чаще 10 погашений в час на чат, дальше 429.
      security:
        - serviceToken: []
      x-access: { roles: [service] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramLinkCodeRedeemRequest"
      responses:
        "200":
          description: Привязка установлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramChat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/telegram/bot/chats/{chatId}:
    get:
      tags: [telegram]
      operationId: getTelegramChat
      summary: Привязка и настройки напоминаний чата (служебная, для бота)
      description: Только для бота (`X-Service-Token`). Чат не привязан — 404 `chat_not_linked`.
      security:
        - serviceToken: []
      x-access: { roles: [service] }
      parameters:
        - $ref: "#/components/parameters/TelegramChatId"
      responses:
        "200":
          description: Чат привязан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramChat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"
    delete:
      tags: [telegram]
      operationId: unlinkTelegramChat
      summary: Отвязать чат (служебная, для бота)
      description: |
        Только для бота (`X-Service-Token`): команда `/unlink` или пользователь заблокировал бота. Строка привязки
        удаляется целиком — вместе с настройками напоминаний. Повтор и непривязанный чат — тоже 204.
      security:
        - serviceToken: []
      x-access: { roles: [service] }
      parameters:
        - $ref: "#/components/parameters/TelegramChatId"
      responses:
        "204":
          description: Чат не привязан
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/telegram/bot/chats/{chatId}/reminders:
    put:
      tags: [telegram]
      operationId: setTelegramChatReminders
      summary: Включить или выключить напоминания о серии (служебная, для бота)
      description: |
        Только для бота (`X-Service-Token`): согласие пользователя — команда или кнопка в чате. `hour` — час по Уфе
        (8–20, вне тихих часов 21:00–08:00); не передан — прежний. Чат не привязан — 404 `chat_not_linked`.
      security:
        - serviceToken: []
      x-access: { roles: [service] }
      parameters:
        - $ref: "#/components/parameters/TelegramChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramRemindersUpdate"
      responses:
        "200":
          description: Новые настройки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramChat"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/telegram/bot/reminders/claim:
    post:
      tags: [telegram]
      operationId: claimTelegramReminders
      summary: Кому напомнить о серии сейчас (служебная, для бота)
      description: |
        Только для бота (`X-Service-Token`). Возвращает чаты, которым пора напомнить, и сразу отмечает их
        напомненными на эти сутки по Уфе — не больше одного напоминания в день, повтор вызова их уже не вернёт.
        Чат попадает в выдачу, если он привязан, напоминания включены, по Уфе уже наступил его час и ещё не
        наступили тихие часы (21:00), а серия аккаунта под угрозой: она есть, но сегодня цель дня ещё не выполнена.
        В ответе только `chat_id` — ни аккаунта, ни серии, ни ника.
      security:
        - serviceToken: []
      x-access: { roles: [service] }
      responses:
        "200":
          description: Чаты для напоминания на эти сутки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramReminderBatch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/telegram/bot/chats/{chatId}/daily-duel:
    post:
      tags: [telegram]
      operationId: issueTelegramDailyDuel
      summary: Ежедневное задание для чата — дуэль (служебная, для бота)
      description: |
        Только для бота (`X-Service-Token`): команда `/daily` или кнопка «Задание дня». Выдаёт связанному аккаунту
        дуэль «Помоги языку» (ADR 0019, ADR 0024) — одну в сутки по Уфе. Диалог — FSM в БД: активный диалог один
        на аккаунт, повторный вызов возвращает тот же диалог и тот же порядок сторон (перезапуск бота ничего не
        теряет). `state = issued` — выданная дуэль; `done` — голос на эти сутки по Уфе уже учтён (новой дуэли не
        будет); `empty` — свежих дуэлей для аккаунта нет. Ответивший или отменённый диалог повторной выдачей не
        возвращается. Чат не привязан — 404 `chat_not_linked`.
      security:
        - serviceToken: []
      x-access: { roles: [service] }
      parameters:
        - $ref: "#/components/parameters/TelegramChatId"
      responses:
        "200":
          description: Дуэль (или состояние «на сегодня всё»)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramDailyDuel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/telegram/bot/chats/{chatId}/daily-duel/cancel:
    post:
      tags: [telegram]
      operationId: cancelTelegramDailyDuel
      summary: Отменить активное задание чата (служебная, для бота)
      description: |
        Только для бота (`X-Service-Token`): команда `/cancel` или кнопка «Отменить». Закрывает активный диалог
        (`cancelled`) — голоса не было, новая дуэль доступна сразу. Нечего отменять (и повтор) — `cancelled: false`.
        Чат не привязан — 404 `chat_not_linked`.
      security:
        - serviceToken: []
      x-access: { roles: [service] }
      parameters:
        - $ref: "#/components/parameters/TelegramChatId"
      responses:
        "200":
          description: Был ли активный диалог
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramDailyCancel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/telegram/bot/dialogs/{dialogId}/answer:
    post:
      tags: [telegram]
      operationId: answerTelegramDailyDuel
      summary: Ответ на ежедневное задание — голос (служебная, для бота)
      description: |
        Только для бота (`X-Service-Token`): нажатие кнопки выбора. Голос пишется в журнал `judgments` (только
        вставка, правило 9) с контекстом `telegram` и группой голосующего, состояние исходника пересчитывается по
        duel-v0, мёд — как в вебе (pending 3, при решении — final). `choice` — относительно порядка сторон из выдачи
        (`a`/`b`), `both` — «Оба подходят», `skip` — «Не знаю» (без мёда). Время от выдачи до ответа API считает
        сам. Ответ — только «учтён» и статус исходника: распределение голосов не показывается (защита от
        конформизма, docs/03 §4a). Повтор той же кнопки — тот же ответ (`replay: true`), новой записи нет; другой
        выбор по отвеченному диалогу — 409 `already_voted`; диалог отменён — 409 `dialog_closed`; нет диалога — 404
        `dialog_not_found`.
      security:
        - serviceToken: []
      x-access: { roles: [service] }
      parameters:
        - $ref: "#/components/parameters/TelegramDialogId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramDailyAnswerRequest"
      responses:
        "200":
          description: Голос учтён (или уже был учтён)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramDailyAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  # ───────────────────────────── ministry: кабинет министерства (ADR 0023) ─────────────────────────────
  /api/v1/ministry/summary:
    get:
      tags: [ministry]
      operationId: getRepublicSummary
      summary: Республика — сводка
      description: |
        Только агрегаты: ни ников, ни номеров мест, ни идентификаторов учеников (CLAUDE.md, правило 5). Числа по
        группам меньше `smallGroupThreshold` учеников скрыты (ADR 0023). Уроки и слова — по всем ученикам: школьным и
        тем, кто учится сам; голоса — все голоса «Помоги языку» без «Не знаю».
      x-access: { roles: [ministry] }
      responses:
        "200":
          description: Сводка по республике
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepublicSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Unexpected"
  /api/v1/ministry/districts:
    get:
      tags: [ministry]
      operationId: listRepublicDistricts
      summary: Республика — районы и городские округа
      description: |
        Все районы и городские округа справочника (демо-район — только если в нём есть классы) и отдельная строка
        учеников без школы («Учусь сам»). Строки с малыми группами скрыты; если скрыта ровно одна строка, скрывается и
        следующая по размеру, чтобы скрытое нельзя было вычислить вычитанием из итога (ADR 0023).
      x-access: { roles: [ministry] }
      responses:
        "200":
          description: Районы с числами
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepublicDistrictList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Unexpected"
  /api/v1/ministry/districts/{districtId}:
    get:
      tags: [ministry]
      operationId: getRepublicDistrict
      summary: Республика — школы района
      description: |
        Подключённые школы района (с хотя бы одним действующим классом) и динамика района по неделям. Правила скрытия —
        те же, что у районов (ADR 0023); если скрыт весь район, школ и недель в ответе нет.
      x-access: { roles: [ministry] }
      parameters:
        - $ref: "#/components/parameters/DistrictId"
      responses:
        "200":
          description: Район, его школы и динамика
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepublicDistrictDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  # ───────────────────────────── fund: словарь для Фонда (ADR 0023) ─────────────────────────────
  /api/v1/fund/dictionary:
    get:
      tags: [fund]
      operationId: getFundDictionary
      summary: Словарь для Фонда — принятые пары
      description: |
        Принятые в словарь пары «исходник — башкирский вариант» с голосами по группам, датой и источником
        варианта. Пары обеих языковых пар: `ba-ru` (башкирский ← русский) и `ba-kz` (башкирский ← казахский),
        пара каждой строки — в поле `langPair`. Решения duel-v0 — `preliminary: true`: до Consensus Engine
        они не входят в релиз датасета (ADR 0019) и могут измениться при пересчёте. Голосующие не раскрываются —
        только числа по группам.
      x-access: { roles: [fund] }
      responses:
        "200":
          description: Принятые пары, новые решения сверху
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundDictionary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/fund/escalated:
    get:
      tags: [fund]
      operationId: listEscalatedItems
      summary: Спорные случаи — для передачи экспертам
      description: |
        Исходники без консенсуса по duel-v0 (`status = escalated`, ADR 0019): оба варианта с голосами по группам и
        временем последнего голоса. Отдельный список по ТЗ хакатона (§4.4, §5) — задел для передачи экспертам
        (УФИЦ РАН); в хакатоне решение эксперта не реализуется. Голосующие не раскрываются — только числа по группам.
        Свежие споры сверху.
      x-access: { roles: [fund] }
      responses:
        "200":
          description: Спорные исходники
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundEscalated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Unexpected"

  # ───────────────────────────── public: витрина без регистрации (ТЗ §3.6) ─────────────────────────────
  /api/v1/public/phrase-of-day:
    get:
      tags: [public]
      operationId: getPhraseOfDay
      summary: Фраза дня — принятая пара корпуса
      description: |
        Пара дня для лендинга и Telegram-бота (ТЗ §3.6/§3.8): один исходник и его основной принятый вариант.
        Выбор детерминирован: из принятых пар «башкирский ← русский» (`item_state.status = accepted`, основной
        вариант, без `native_rejected`; пары ba-kz во фразе дня не участвуют — лендинг показывает русский
        исходник) индекс — устойчивый хеш учебных суток по Уфе (Asia/Yekaterinburg, UTC+5), поэтому
        в течение суток все клиенты показывают одну и ту же пару, в полночь по Уфе она меняется. Персональных
        данных нет — только тексты пары и источники. Принятых пар ещё нет — поле `pair` отсутствует, блок
        не показывают.
      security: []
      x-access: { roles: [anonymous] }
      responses:
        "200":
          description: Пара дня (или только дата, если корпус пуст)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhraseOfDay"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/public/dictionary:
    get:
      tags: [public]
      operationId: getPublicDictionary
      summary: Публичный словарь — выгрузка принятых пар без регистрации
      description: |
        Выгрузка словаря (ТЗ §5): принятые пары «исходник — башкирский вариант» с источниками — анонимно,
        без ключей и квот. Языковые пары: `ba-ru` (башкирский ← русский) и `ba-kz` (башкирский ← казахский);
        пара каждой строки — в поле `langPair` строки. Персональных данных нет: только тексты пар, их виды,
        источники и статусы проверки (правило 13). `status=confirmed` — все принятые пары, `status=expert_review`
        — только проверенные носителем языка. `format=csv` — те же строки таблицей для Excel: разделитель точка
        с запятой, UTF-8 с BOM, столбцы `fragmentId;langPair;translation;textBa;status;confirmed;sources`
        (источники — названия через запятую). Выгрузка для Фонда с голосами по группам — отдельная операция
        `getFundDictionary`.
      security: []
      x-access: { roles: [anonymous] }
      parameters:
        - name: status
          in: query
          required: false
          description: Какие строки отдавать — все принятые или только проверенные носителем
          schema:
            type: string
            enum: [confirmed, expert_review]
            default: confirmed
        - name: format
          in: query
          required: false
          description: JSON (по умолчанию) или CSV для Excel
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: Принятые пары словаря — JSON или CSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDictionary"
            text/csv:
              schema:
                type: string
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/public/leaderboard:
    get:
      tags: [public]
      operationId: getPublicLeaderboard
      summary: Доска почёта — активные школы и классы
      description: |
        Доска почёта (ТЗ §4.5): самые активные школы и классы за период. Только школы и классы — ни ников, ни
        имён, ни идентификаторов учеников (правило 13); публичного рейтинга отдельных детей нет и не будет
        (docs/02 §6). Школы и классы с активными учениками меньше `smallGroupThreshold` в доску не попадают
        (ADR 0023). Периоды по Уфе (Asia/Yekaterinburg): `day` — учебные сутки, `week` — неделя пн–вс
        (по умолчанию), `month` — календарный месяц, `year` — календарный год. Пустые списки — данные ещё
        не накоплены, блок на витрине не показывают.
      security: []
      x-access: { roles: [anonymous] }
      parameters:
        - name: period
          in: query
          required: false
          description: Период доски — учебные сутки, неделя, месяц или год по Уфе
          schema:
            type: string
            enum: [day, week, month, year]
            default: week
      responses:
        "200":
          description: Топ школ и классов по активности за период
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicLeaderboard"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Unexpected"

components:
  parameters:
    DistrictId:
      name: districtId
      in: path
      required: true
      description: Идентификатор района или городского округа
      schema:
        type: string
        format: uuid
    ClassId:
      name: id
      in: path
      required: true
      description: Идентификатор класса
      schema:
        type: string
        format: uuid
    SeatNumber:
      name: seat
      in: path
      required: true
      description: Номер места в классе
      schema:
        type: integer
        minimum: 1
        maximum: 99
    JoinRequestId:
      name: rid
      in: path
      required: true
      description: Идентификатор заявки на вход
      schema:
        type: string
        format: uuid
    VerificationId:
      name: id
      in: path
      required: true
      description: Идентификатор заявки учителя
      schema:
        type: string
        format: uuid
    ConsentId:
      name: id
      in: path
      required: true
      description: Идентификатор согласия
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозрачный курсор из `nextCursor` предыдущей страницы. Битый или чужой курсор — 422 `validation_failed`.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Ключ идемпотентности (например, UUID). Повтор с тем же ключом и тем же телом в течение суток возвращает первый
        результат. Пока первый запрос с этим ключом ещё выполняется, повтор получает 409 `request_in_progress`
        с `Retry-After` — его нужно повторить позже с тем же ключом. Тот же ключ с другим телом — 422
        `idempotency_key_reused`. Если первый запрос завершился ошибкой, ключ освобождается.
      schema:
        type: string
        minLength: 8
        maxLength: 128

    LessonId:
      name: lessonId
      in: path
      required: true
      description: Идентификатор узла тропы (`TrailNode.id` из `GET /course`)
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        maxLength: 64
    UnitId:
      name: unitId
      in: path
      required: true
      description: Идентификатор места тропы (`CourseUnit.id` из `GET /course`)
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        maxLength: 64
    RunId:
      name: runId
      in: path
      required: true
      description: Идентификатор забега (клиентский UUIDv7 из `POST /lessons/{lessonId}/runs`)
      schema:
        type: string
        format: uuid
    CorpusItemId:
      name: id
      in: path
      required: true
      description: Идентификатор исходника корпуса (`itemId` дуэли)
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      description: Идентификатор задания класса
      schema:
        type: string
        format: uuid
    TelegramChatId:
      name: chatId
      in: path
      required: true
      description: Идентификатор личного чата с ботом (`chat.id` = `user.id` Telegram) — десятичной строкой
      schema:
        $ref: "#/components/schemas/TelegramChatIdValue"
    TelegramDialogId:
      name: dialogId
      in: path
      required: true
      description: Идентификатор диалога ежедневного задания (FSM, ADR 0024) — из выдачи `daily-duel`
      schema:
        type: string
        format: uuid

  headers:
    RetryAfter:
      description: Через сколько секунд можно повторить запрос
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Тело запроса не разобрано (не JSON, неверный тип содержимого)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Нет или недействителен access-токен либо неверные учётные данные (см. `code`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Роль или политика доступа не разрешает операцию (см. `code`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Ресурс не найден или его существование не раскрывается
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Состояние ресурса не позволяет операцию (см. `code`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: Ресурс больше недоступен (истёк срок жизни или заменён — см. `code`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: Запрос не прошёл проверку схемы или бизнес-правил; подробности — в `errors`
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: |
        Превышен лимит частоты запросов. `Retry-After` — через сколько секунд повторить: остаток окна лимита или 1,
        если мешают только попытки, которые ещё проверяются.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Функция временно недоступна (см. `code`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unexpected:
      description: Непредвиденная ошибка
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    CheckStatus:
      type: string
      enum: [ok, down]
    Health:
      type: object
      description: Ответ health-проверки. Схемы ответов открыты для новых полей (клиенты обязаны игнорировать неизвестные поля).
      required: [status, service, version, checks]
      properties:
        status:
          $ref: "#/components/schemas/CheckStatus"
        service:
          type: string
          examples: [api]
        version:
          type: string
          examples: [0.1.0]
        checks:
          type: object
          required: [postgres, valkey]
          properties:
            postgres:
              $ref: "#/components/schemas/CheckStatus"
            valkey:
              $ref: "#/components/schemas/CheckStatus"
    Problem:
      type: object
      description: |
        RFC 9457 Problem Details. `code` — машиночитаемая причина (клиенты ветвятся по нему, а не по `title`).
        Значения: `unauthenticated`, `token_expired`, `forbidden`, `not_found`, `validation_failed`, `bad_request`,
        `rate_limited`, `card_invalid`, `card_revoked`, `consent_revoked`, `class_archived`, `payload_invalid`,
        `class_code_not_found`, `otp_invalid`, `otp_expired`, `otp_attempts_exceeded`, `totp_required`, `totp_invalid`,
        `email_login_unavailable`, `refresh_invalid`, `refresh_reused`, `session_revoked`, `account_blocked`
        (401 — аккаунт заблокирован, вход невозможен до разблокировки), `nickname_not_allowed`,
        `teacher_not_verified`, `school_not_allowed`, `class_exists`, `seat_limit_exceeded`, `print_job_expired`,
        `print_job_replaced` (410 — карточки задания печати уже заменены новым выпуском),
        `join_request_closed`, `consent_required`, `verification_pending`, `already_verified`, `already_decided`,
        `document_not_current`, `consent_exists`, `consent_already_revoked`, `request_in_progress` (409 — запрос
        с этим `Idempotency-Key` ещё выполняется), `idempotency_key_reused` (422 — тот же ключ с другим телом),
        `documents_unavailable` (503 — справочник юридических документов пуст), `staff_locked` (429 — вход сотрудника
        заблокирован после неверных TOTP), `payload_too_large` (413 — тело запроса больше 64 КБ), `join_queue_full`
        (429 — в классе уже 40 заявок ждут решения учителя), `service_unavailable`,
        `internal`. Уроки, мотивация, дуэли: `not_implemented` (501 — операция контракта ещё не реализована), `lesson_locked`
        (409 — узел тропы закрыт), `run_conflict` (409 — `runId` уже занят другим уроком или аккаунтом), `run_completed`
        (409 — забег завершён), `run_incomplete` (409 — не на все упражнения есть ответ), `exercise_not_in_run` (422),
        `pairs_incomplete` (422 — в ответе «Пары» соединены не все пары или одна сторона повторяется),
        `answer_type_mismatch` (422 — вид ответа не подходит к упражнению), `already_voted` (409), `vote_required`
        (403 — голоса видны после своего голоса), `content_unavailable` (503 — контент курса не импортирован).
        Значения заданий (ADR 0021): `assignment_limit` (409 — у класса уже два активных задания), `assignment_exists`
        (409 — такое же задание уже активно).
        Значения Telegram (ADR 0020): `init_data_invalid` (422 — у `POST /telegram/link`; 401 — у `POST /auth/telegram`),
        `init_data_expired` (422 — у `POST /telegram/link`; 401 — у `POST /auth/telegram`), `telegram_unavailable`
        (503 — бот не настроен), `chat_not_linked` (404 — чат не привязан), `telegram_login_forbidden`
        (403 — аккаунт сотрудника: вход в консоль по e-mail с TOTP, не через Telegram), `code_not_found`
        (404 — код привязки не найден, истёк или уже использован). Ежедневное задание бота (ADR 0024): `dialog_not_found`
        (404 — диалога нет), `dialog_closed` (409 — диалог отменён или закрыт).
        Значения самостоятельного обучения (ADR 0022): `login_card_unavailable` (403 — личная карточка аккаунту
        не положена), `email_in_use` (409 — адрес уже у другого аккаунта), `email_already_set` (409),
        `already_in_class` (409 — ученик уже в классе). Список открыт: неизвестный `code`
        клиент обрабатывает по `status`. `title` и `errors[].detail` — понятный человеку текст на русском.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Машиночитаемая причина ошибки
          examples: [card_revoked]
        errors:
          type: array
          description: Ошибки проверки полей запроса (для 422)
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [pointer, detail]
      properties:
        pointer:
          type: string
          description: JSON Pointer на поле запроса (RFC 6901), для параметров — `#/query/<имя>` или `#/path/<имя>`
          examples: ["/count"]
        detail:
          type: string
          description: Что не так с полем — по-русски, для показа человеку
          examples: ["Неверный идентификатор"]

    # ── identity ──
    AccountKind:
      type: string
      description: "`child` — псевдонимный детский аккаунт без ПДн; `adult` — взрослый (учитель, родитель); `staff` — сотрудник"
      enum: [child, adult, staff]
    Role:
      type: string
      description: |
        Роль RBAC (ADR 0017). `teacher` — только подтверждённый учитель. Набор закрыт базовой версией контракта: роли
        сотрудников, добавленные позже, есть только в `staffRoles` (ADR 0023).
      enum: [student, teacher, moderator, admin]
    StaffRole:
      type: string
      description: |
        Роль сотрудника консоли (ADR 0017, 0023): `moderator`, `admin`, `ministry` — кабинет министерства, `fund` —
        словарь для Фонда. Набор расширяется: незнакомую роль клиент пропускает.
      x-extensible-enum: [moderator, admin, ministry, fund]
    TeacherStatus:
      type: string
      description: Статус подтверждения учителя для взрослого аккаунта
      enum: [none, pending, verified, rejected]
    UiMode:
      type: string
      description: |
        Режим интерфейса по возрасту: `bee` — «Пчёлка» (1–4 класс, 7–10 лет), `bortnik` — «Бортник» (5–8, 11–14),
        `keeper` — «Хранитель» (9–11, 15–17 и взрослые). Ученику класса режим выставляется при каждом входе по номеру
        класса, пока он не выбрал его сам (`PATCH /me`); самостоятельному ученику — по возрастному диапазону (`AgeBand`).
      enum: [bee, bortnik, keeper]
    Locale:
      type: string
      enum: [ru, ba]
    DevicePlatform:
      type: string
      enum: [web, ios, android, bot]
    DeviceInfo:
      type: object
      description: Устройство, к которому привязывается сессия. `installId` клиент генерирует один раз на установку (UUID).
      additionalProperties: false
      required: [installId, platform]
      properties:
        installId:
          type: string
          format: uuid
        platform:
          $ref: "#/components/schemas/DevicePlatform"
        appVersion:
          type: string
          maxLength: 32
    QrLoginRequest:
      type: object
      additionalProperties: false
      required: [payload, device]
      properties:
        payload:
          type: string
          minLength: 1
          maxLength: 512
          description: Полезная нагрузка из QR-карточки `TT1.<seat>.<secret>.<check>` (ссылка `…/q#TT1.…` с ранних карточек тоже разбирается)
          examples: ["TT1.0123456789.ABCDEFGHJKMNPQRSTVWXYZ0123.6V"]
        device:
          $ref: "#/components/schemas/DeviceInfo"
    ClassCodeLoginRequest:
      type: object
      additionalProperties: false
      required: [code, nicknameId, device]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Код класса как его ввёл ученик; сервер нормализует ввод (регистр, O/0, I/1/L, пробелы, дефисы)
          examples: ["K7Q-4MZ"]
        nicknameId:
          type: string
          pattern: "^[a-z0-9.:_-]{1,64}$"
          description: Идентификатор ника из `GET /nicknames/suggest`
        device:
          $ref: "#/components/schemas/DeviceInfo"
    ClassCodeLoginTicket:
      type: object
      required: [requestId, pollToken, status, expiresAt, pollIntervalSeconds, class]
      properties:
        requestId:
          type: string
          format: uuid
        pollToken:
          type: string
          description: Секрет для опроса статуса (заголовок `X-Poll-Token`). Не сохранять дольше срока заявки.
        status:
          $ref: "#/components/schemas/JoinRequestStatus"
        expiresAt:
          type: string
          format: date-time
        pollIntervalSeconds:
          type: integer
          minimum: 1
          examples: [3]
        class:
          $ref: "#/components/schemas/ClassCodeLoginClass"
    ClassCodeLoginClass:
      type: object
      description: Класс, в который подана заявка, — только номер и литера; школа не раскрывается (docs/02 §9)
      required: [title, grade, letter]
      properties:
        title:
          type: string
          examples: ["5 «Б»"]
        grade:
          type: integer
          minimum: 1
          maximum: 11
        letter:
          type: string
          examples: ["Б"]
    ClassCodeLoginStatus:
      type: object
      required: [requestId, status, expiresAt, pollIntervalSeconds]
      properties:
        requestId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JoinRequestStatus"
        expiresAt:
          type: string
          format: date-time
        pollIntervalSeconds:
          type: integer
          minimum: 1
        session:
          $ref: "#/components/schemas/AuthSession"
          description: |
            Только при `status = approved`: при первом опросе после одобрения и при повторном опросе
            с `X-Device-Install-Id` устройства заявки до `expiresAt` (если ответ с сессией потерялся)
    OtpRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    OtpChallenge:
      type: object
      required: [challengeId, expiresAt, resendAfterSeconds, codeLength]
      properties:
        challengeId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        resendAfterSeconds:
          type: integer
          minimum: 0
          description: Через сколько секунд можно запросить код повторно
        codeLength:
          type: integer
          minimum: 4
          maximum: 6
          description: Длина кода — для поля ввода
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code, device]
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{4,6}$"
        totp:
          type: string
          pattern: "^[0-9]{6}$"
          description: Код из приложения-аутентификатора — обязателен для сотрудников
        device:
          $ref: "#/components/schemas/DeviceInfo"
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken, deviceInstallId]
      properties:
        refreshToken:
          type: string
          minLength: 16
          maxLength: 256
        deviceInstallId:
          type: string
          format: uuid
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        allDevices:
          type: boolean
          description: Выйти на всех устройствах (отозвать все сессии аккаунта). Не указано — как `false`, только текущая сессия.
    AuthSession:
      type: object
      description: Пара токенов и аккаунт (ADR 0015)
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, tokenType, account]
      properties:
        accessToken:
          type: string
          description: JWT ES256, 15 минут
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Непрозрачный одноразовый токен (`ttr_…`); на сервере хранится только SHA-256
        refreshTokenExpiresAt:
          type: string
          format: date-time
        tokenType:
          type: string
          enum: [Bearer]
        account:
          $ref: "#/components/schemas/Me"
    Me:
      type: object
      required: [id, kind, roles, locale, teacherStatus, classes, pendingConsents]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AccountKind"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        staffRoles:
          type: array
          description: Все роли сотрудника (только у `kind = staff`), включая роли вне `Role` (ADR 0023)
          items:
            $ref: "#/components/schemas/StaffRole"
        nickname:
          type: string
          description: |
            Ник из словаря — у детей и у взрослых, которые учатся (ADR 0022). Нет — ник ещё не выбран; у взрослого это
            значит, что он ещё не выбрал «Учиться»
          examples: ["Смелая пчела"]
        uiMode:
          $ref: "#/components/schemas/UiMode"
        ageBand:
          $ref: "#/components/schemas/AgeBand"
        dailyGoal:
          type: integer
          minimum: 1
          maximum: 3
          description: Цель дня, выбранная самим учеником (соты в сутки). Нет — по умолчанию 2 (`DailyGoal`)
        loginCard:
          $ref: "#/components/schemas/LoginCardStatus"
        emailLogin:
          type: boolean
          description: |
            Вход по почте привязан (ADR 0022 §10). Поле бывает только у детских аккаунтов: сам адрес не хранится —
            только ключ входа, поэтому адрес в ответе не возвращается. У взрослого о привязке говорит `profile.email`.
        locale:
          $ref: "#/components/schemas/Locale"
        teacherStatus:
          $ref: "#/components/schemas/TeacherStatus"
        classes:
          type: array
          items:
            $ref: "#/components/schemas/MyClass"
        profile:
          $ref: "#/components/schemas/AdultProfile"
        pendingConsents:
          type: array
          description: Виды документов, действующую версию которых аккаунт должен принять (взрослым)
          items:
            $ref: "#/components/schemas/LegalDocumentKind"
    AdultProfile:
      type: object
      description: ПДн взрослого — только ему самому (схема `pii`). У детских аккаунтов отсутствует.
      required: [email]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
    MyClass:
      type: object
      required: [id, title, schoolName, role]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          examples: ["5 «Б»"]
        schoolName:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"
        seatNumber:
          type: integer
          description: Номер места ученика
    MembershipRole:
      type: string
      enum: [student, teacher]
    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nicknameId:
          type: string
          pattern: "^[a-z0-9.:_-]{1,64}$"
        uiMode:
          $ref: "#/components/schemas/UiMode"
          description: Выбор самого пользователя; после него режим больше не меняется по номеру класса
        locale:
          $ref: "#/components/schemas/Locale"
        ageBand:
          $ref: "#/components/schemas/AgeBand"
          description: Возрастной диапазон (детям — детские, взрослым — только `adult`); задаёт режим интерфейса и группу лиги
        dailyGoal:
          type: integer
          minimum: 1
          maximum: 3
          description: Цель дня — 1, 2 или 3 соты
    NicknameSuggestion:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string
          examples: ["Смелая пчела"]
    NicknameSuggestions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NicknameSuggestion"

    # ── identity: самостоятельное обучение (ADR 0022) ──
    AgeBand:
      type: string
      description: |
        Возрастной диапазон без возраста по годам (ADR 0022): `age_7_10` — режим «Пчёлка», `age_11_14` — «Бортник»,
        `age_15_17` — «Хранитель», `adult` — взрослый, «Хранитель». Дети и взрослые не смешиваются в лиге; дети
        соревнуются с ровесниками своего диапазона.
      enum: [age_7_10, age_11_14, age_15_17, adult]
    SelfSignupRequest:
      type: object
      additionalProperties: false
      required: [device, nicknameId, ageBand]
      properties:
        device:
          $ref: "#/components/schemas/DeviceInfo"
        nicknameId:
          type: string
          pattern: "^[a-z0-9.:_-]{1,64}$"
          description: Идентификатор ника из `GET /nicknames/suggest`
        ageBand:
          $ref: "#/components/schemas/AgeBand"
        dailyGoal:
          type: integer
          minimum: 1
          maximum: 3
          description: Цель дня — 1, 2 или 3 соты; не указана — по умолчанию 2
    LoginCardLoginRequest:
      type: object
      additionalProperties: false
      required: [payload, device]
      properties:
        payload:
          type: string
          minLength: 1
          maxLength: 512
          description: Полезная нагрузка личной карточки `TP1.<handle>.<secret>.<check>` (ADR 0022)
          examples: ["TP1.0123456789.ABCDEFGHJKMNPQRSTVWXYZ0123.4S"]
        device:
          $ref: "#/components/schemas/DeviceInfo"
    LoginCardStatus:
      type: string
      description: |
        Личная карточка входа: `none` — можно сделать, `issued` — выпущена. Поля нет в `Me` — карточка аккаунту
        не положена (ученик класса, учитель, взрослый с почтой)
      enum: [none, issued]
    LoginCard:
      type: object
      description: |
        Личная карточка входа — только её владельцу. В QR кладётся `payload` как есть, без ссылки (как у карточки
        места, ADR 0016 §2): системная камера не откроет браузер с секретом.
      required: [payload, version, issuedAt]
      properties:
        payload:
          type: string
          description: Полезная нагрузка `TP1.<handle>.<secret>.<check>`
        version:
          type: integer
          minimum: 1
          description: Номер выпуска — растёт с каждым перевыпуском
        issuedAt:
          type: string
          format: date-time
    AttachEmailRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId:
          type: string
          format: uuid
          description: Вызов кода из `POST /auth/otp/request` с привязываемым адресом
        code:
          type: string
          pattern: "^[0-9]{4,6}$"
    ClassJoinRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Код класса как его ввёл ученик; сервер нормализует ввод
          examples: ["K7Q-4MZ"]
    ClassJoinTicket:
      type: object
      description: Заявка на вступление в класс уже вошедшего ученика — без секрета опроса (опрос — по сессии)
      required: [requestId, status, expiresAt, pollIntervalSeconds, class]
      properties:
        requestId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JoinRequestStatus"
        expiresAt:
          type: string
          format: date-time
        pollIntervalSeconds:
          type: integer
          minimum: 1
        class:
          $ref: "#/components/schemas/ClassCodeLoginClass"

    # ── org ──
    DistrictKind:
      type: string
      description: "`municipal_district` — муниципальный район, `urban_okrug` — городской округ"
      enum: [municipal_district, urban_okrug]
    District:
      type: object
      required: [id, oktmo, nameRu, kind]
      properties:
        id:
          type: string
          format: uuid
        oktmo:
          type: string
          description: Код ОКТМО
        nameRu:
          type: string
        nameBa:
          type: string
          description: Название на башкирском (если есть в источнике)
        kind:
          $ref: "#/components/schemas/DistrictKind"
    DistrictList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/District"
    SchoolCategory:
      type: string
      enum: [city_large, city_small, rural, small_rural]
    School:
      type: object
      required: [id, districtId, nameRu, shortNameRu, isDemo]
      properties:
        id:
          type: string
          format: uuid
        districtId:
          type: string
          format: uuid
        nameRu:
          type: string
        shortNameRu:
          type: string
        nameBa:
          type: string
        address:
          type: string
        category:
          $ref: "#/components/schemas/SchoolCategory"
        bashkirMedium:
          type: boolean
          description: Обучение ведётся на башкирском языке (если известно)
        isDemo:
          type: boolean
          description: Демо-запись, не из официального справочника
    SchoolPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/School"
        nextCursor:
          type: string
    SchoolRef:
      type: object
      required: [id, shortNameRu, districtId]
      properties:
        id:
          type: string
          format: uuid
        shortNameRu:
          type: string
        districtId:
          type: string
          format: uuid
        isDemo:
          type: boolean
    ClassProgram:
      type: string
      description: "`native` — родной язык, `state` — государственный язык РБ, `elective` — факультатив"
      enum: [native, state, elective]
    CreateClassRequest:
      type: object
      additionalProperties: false
      required: [grade, letter, program]
      properties:
        schoolId:
          type: string
          format: uuid
          description: Школа; по умолчанию — школа из одобренной заявки учителя
        grade:
          type: integer
          minimum: 1
          maximum: 11
        letter:
          type: string
          minLength: 1
          maxLength: 3
          description: Литера класса (кириллица, в том числе башкирские буквы, или цифры); нормализуется через `bashkir-text`
          examples: ["Б"]
        program:
          $ref: "#/components/schemas/ClassProgram"
        academicYear:
          type: integer
          minimum: 2025
          maximum: 2100
          description: Год начала учебного года; по умолчанию — текущий учебный год по Уфе
    ClassSummary:
      type: object
      required: [id, title, grade, letter, program, academicYear, school, myRole]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          examples: ["5 «Б»"]
        grade:
          type: integer
        letter:
          type: string
        program:
          $ref: "#/components/schemas/ClassProgram"
        academicYear:
          type: integer
        school:
          $ref: "#/components/schemas/SchoolRef"
        myRole:
          $ref: "#/components/schemas/MembershipRole"
        studentCount:
          type: integer
          description: Только учителю класса
        seatCount:
          type: integer
          description: Только учителю класса
    ClassList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClassSummary"
    ClassDetail:
      type: object
      required: [id, title, grade, letter, program, academicYear, school, myRole]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          examples: ["5 «Б»"]
        grade:
          type: integer
        letter:
          type: string
        program:
          $ref: "#/components/schemas/ClassProgram"
        academicYear:
          type: integer
        school:
          $ref: "#/components/schemas/SchoolRef"
        myRole:
          $ref: "#/components/schemas/MembershipRole"
        mySeatNumber:
          type: integer
          description: Только ученику — номер его места
        seats:
          type: array
          description: Только учителю класса, по возрастанию номера
          items:
            $ref: "#/components/schemas/Seat"
        joinCode:
          $ref: "#/components/schemas/JoinCodeState"
        pendingJoinRequestCount:
          type: integer
          description: Только учителю класса
    JoinCodeState:
      type: object
      description: Действующий код класса (сам код не возвращается повторно — только срок). Только учителю класса.
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
    CardStatus:
      type: string
      description: "Статус карточки места: `none` — карточки нет (ученик вошёл по коду класса); `active` — действует; `revoked` — отозвана, вход по ней невозможен"
      enum: [none, active, revoked]
    Seat:
      type: object
      required: [number, cardStatus, cardVersion]
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 99
        cardStatus:
          $ref: "#/components/schemas/CardStatus"
        cardVersion:
          type: integer
          minimum: 0
          description: Номер выпуска карточки места (растёт при перевыпуске); 0 — место без карточки (вход по коду класса)
        cardIssuedAt:
          type: string
          format: date-time
        student:
          $ref: "#/components/schemas/SeatStudent"
        consent:
          $ref: "#/components/schemas/SeatConsent"
    SeatStudent:
      type: object
      description: Ученик на месте — только ник (ADR 0009). Нет — место ещё не занято.
      required: [accountId, joinedAt]
      properties:
        accountId:
          type: string
          format: uuid
        nickname:
          type: string
          description: Нет — ученик ещё не выбрал ник
          examples: ["Смелая пчела"]
        joinedAt:
          type: string
          format: date-time
    SeatConsent:
      type: object
      description: Последнее бумажное согласие места. Нет — согласие не отмечено.
      required: [consentId, status, documentVersion, givenAt]
      properties:
        consentId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ConsentStatus"
        documentVersion:
          type: string
        givenAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    IssueSeatsRequest:
      type: object
      additionalProperties: false
      required: [count]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 40
    PrintJob:
      type: object
      description: Задание печати — секреты карточек доступны только в PDF по этому идентификатору, до `expiresAt`
      required: [id, expiresAt, seatNumbers, pdfPath]
      properties:
        id:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        seatNumbers:
          type: array
          items:
            type: integer
        pdfPath:
          type: string
          description: Путь для скачивания PDF относительно сервера API
          examples: ["/api/v1/classes/0193f7a4-0000-7000-8000-000000000001/cards.pdf?printJob=0193f7a4-0000-7000-8000-000000000002"]
    SeatIssueResult:
      type: object
      required: [printJob, seats]
      properties:
        printJob:
          $ref: "#/components/schemas/PrintJob"
        seats:
          type: array
          items:
            $ref: "#/components/schemas/Seat"
    JoinCode:
      type: object
      required: [code, display, expiresAt, permanent]
      properties:
        code:
          type: string
          description: 6 символов base32 Crockford (ADR 0016)
          examples: [K7Q4MZ]
        display:
          type: string
          description: Для показа на экране
          examples: ["K7Q-4MZ"]
        expiresAt:
          type: string
          format: date-time
        permanent:
          type: boolean
          description: |
            Постоянный код стенда показа (настройка API `AUTH_DEMO_CLASS_CODE`, в production запрещена): один и тот же
            у класса, срок — через год, «Закрыть код класса» его не гасит. Обычный код — `false`.
    JoinRequestStatus:
      type: string
      description: "`consumed` — сессия по одобренной заявке уже выдана"
      enum: [pending, approved, rejected, expired, consumed]
    JoinRequest:
      type: object
      required: [id, status, nickname, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JoinRequestStatus"
        nickname:
          type: string
          examples: ["Смелая пчела"]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        seatNumber:
          type: integer
          description: Выданное место (после одобрения)
    JoinRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JoinRequest"

    # ── moderation ──
    TeacherVerificationRequest:
      type: object
      additionalProperties: false
      required: [schoolId, fullName, position]
      properties:
        schoolId:
          type: string
          format: uuid
        fullName:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            ФИО полностью (ПДн взрослого, схема `pii`). После нормализации `@teletau/bashkir-text` допустимы только
            русские и башкирские буквы, пробел, дефис и апостроф; латиница, цифры, эмодзи и управляющие символы — 422.
            Не короче 3 символов после нормализации. Сначала проверяются символы, потом длина (422 с указателем на поле).
          examples: ["Иванова Мария Петровна"]
        position:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            Должность. После нормализации `@teletau/bashkir-text` допустимы русские и башкирские буквы, цифры, пробел
            и знаки препинания (`. , ; : - – — ( ) « » " ' № /`), нужна хотя бы одна буква; эмодзи, латиница и
            управляющие символы — 422. Не короче 2 символов после нормализации; символы проверяются раньше длины.
          examples: ["Учитель башкирского языка"]
    TeacherVerificationStatus:
      type: string
      enum: [pending, approved, rejected]
    TeacherVerification:
      type: object
      required: [id, status, applicant, school, position, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TeacherVerificationStatus"
        applicant:
          $ref: "#/components/schemas/TeacherApplicant"
        school:
          $ref: "#/components/schemas/SchoolRef"
        position:
          type: string
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        decisionReason:
          type: string
          description: Причина отказа (видна заявителю и модераторам; хранится в схеме `pii`)
    TeacherApplicant:
      type: object
      description: Заявитель — видят только он сам и модераторы
      required: [accountId, email, fullName]
      properties:
        accountId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
    TeacherVerificationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeacherVerification"
        nextCursor:
          type: string
    RejectTeacherVerificationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Причина отказа (видна заявителю, хранится в схеме `pii`); переводы строк допустимы, прочие управляющие символы — 422

    # ── consent ──
    LegalDocumentKind:
      type: string
      description: "`privacy` — политика обработки ПДн, `terms` — пользовательское соглашение, `consent_child` — бланк согласия родителя, `consent_adult` — согласие взрослого на обработку ПДн"
      enum: [privacy, terms, consent_child, consent_adult]
    LegalDocument:
      type: object
      required: [id, kind, version, title, effectiveFrom]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/LegalDocumentKind"
        version:
          type: string
          examples: ["2026-11-01"]
        title:
          type: string
        url:
          type: string
          format: uri-reference
          description: Адрес страницы с текстом документа в вебе (`${PUBLIC_WEB_URL}/legal/{kind}/{version}`)
        effectiveFrom:
          type: string
          format: date-time
    LegalDocumentText:
      type: object
      description: Версия документа с текстом. Текст версии неизменяем, `bodySha256` совпадает с хешем принятого текста.
      required: [id, kind, version, title, effectiveFrom, body, bodySha256]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/LegalDocumentKind"
        version:
          type: string
          examples: ["2026-11-01"]
        title:
          type: string
        url:
          type: string
          format: uri-reference
          description: Адрес страницы документа в вебе
        effectiveFrom:
          type: string
          format: date-time
        body:
          type: array
          description: Абзацы текста
          items:
            type: string
        bodySha256:
          type: string
          description: SHA-256 текста (абзацы через пустую строку), hex
          pattern: "^[0-9a-f]{64}$"
    LegalDocumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LegalDocument"
    AcceptConsentsRequest:
      type: object
      additionalProperties: false
      required: [documentIds]
      properties:
        documentIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
    PaperConsentRequest:
      type: object
      additionalProperties: false
      properties:
        documentId:
          type: string
          format: uuid
          description: Версия бланка; по умолчанию — действующая версия `consent_child`
        signedOn:
          type: string
          format: date
          description: Дата подписи на бланке (по умолчанию — сегодня по Уфе)
    ConsentMethod:
      type: string
      enum: [electronic, paper]
    ConsentStatus:
      type: string
      enum: [given, revoked]
    ConsentSubject:
      type: object
      description: "Субъект согласия: взрослый аккаунт (`account`) или место ученика (`seat`) для бумажного согласия"
      required: [type]
      properties:
        type:
          type: string
          enum: [account, seat]
        accountId:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        seatNumber:
          type: integer
    Consent:
      type: object
      required: [id, document, method, status, subject, givenAt]
      properties:
        id:
          type: string
          format: uuid
        document:
          $ref: "#/components/schemas/LegalDocumentRef"
        method:
          $ref: "#/components/schemas/ConsentMethod"
        status:
          $ref: "#/components/schemas/ConsentStatus"
        subject:
          $ref: "#/components/schemas/ConsentSubject"
        givenAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    LegalDocumentRef:
      type: object
      required: [id, kind, version]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/LegalDocumentKind"
        version:
          type: string
    ConsentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Consent"

    # ── admin ──
    AuditEntry:
      type: object
      required: [id, at, action]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        action:
          type: string
          description: Действие в виде `<объект>.<событие>` (перечень — ADR 0017)
          examples: [card.reissued]
        actor:
          $ref: "#/components/schemas/AuditActor"
        target:
          $ref: "#/components/schemas/AuditTarget"
        metadata:
          type: object
          description: Детали без ПДн и секретов (например, номер места, версия карточки)
          additionalProperties: true
        requestId:
          type: string
    AuditActor:
      type: object
      description: Кто совершил действие. Нет — система.
      required: [accountId, kind]
      properties:
        accountId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AccountKind"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        staffRoles:
          type: array
          description: Роли сотрудника на момент действия, включая роли вне `Role` (ADR 0023)
          items:
            $ref: "#/components/schemas/StaffRole"
    AuditTarget:
      type: object
      required: [type]
      properties:
        type:
          type: string
          examples: [class_seat]
        id:
          type: string
          format: uuid
    AuditLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextCursor:
          type: string

    # ── Общее для обучения и корпуса ──
    ReviewStatus:
      type: string
      enum: [needs_native_review, native_approved]
      description: |
        Проверка башкирского текста носителем (CLAUDE.md, правило 6). Контент взят из открытых человеческих
        источников и помечен `needs_native_review`; машинного башкирского текста в нём нет. Отклонённые носителем
        строки не отдаются вовсе.
    BaString:
      type: object
      description: Башкирская строка для показа (`lang="ba"`) с флагом проверки носителем.
      required: [text, review]
      properties:
        text:
          type: string
          description: Текст в канонической форме `@teletau/bashkir-text` (`normalize`)
        review:
          $ref: "#/components/schemas/ReviewStatus"
        audio:
          $ref: "#/components/schemas/AudioClip"
    AudioClip:
      type: object
      description: |
        Запись произношения носителем (кнопка «Послушать»). Только записи из контента с источником — файлы Wikimedia
        Commons (туда выкладывает записи Lingua Libre); синтеза речи нет. Нет записи — нет поля и нет кнопки.
        Запись отдаёт наш сайт, а не Commons: копии лежат на сайте под `/audio/` (`scripts/prepare-audio.mjs`), пути
        относительные — клиент дополняет их адресом сайта (веб — свой origin). Откуда запись — `source` (страница файла
        Commons, диктор, лицензия).
      required: [url]
      properties:
        url:
          type: string
          format: uri-reference
          description: |
            Путь к копии записи на сайте в AAC (`/audio/<id>.m4a`) — её играют все платформы: iOS, Android, Safari,
            Chrome, Firefox. `<id>` — первые 16 hex SHA-256 копии записи.
          examples: ["/audio/288218d294ae3224.m4a"]
        files:
          type: array
          description: |
            Все копии записи на сайте по порядку предпочтения — AAC (как `url`), затем Ogg: оригинал Ogg Vorbis с Commons
            или Ogg Opus из записи в другом формате (WAV Lingua Libre).
          items:
            $ref: "#/components/schemas/AudioFile"
        source:
          $ref: "#/components/schemas/SourceCitation"
    AudioFile:
      type: object
      description: Копия записи на сайте
      required: [url, type]
      properties:
        url:
          type: string
          format: uri-reference
          description: Путь на сайте (`/audio/<id>.m4a` или `/audio/<id>.ogg`)
          examples: ["/audio/288218d294ae3224.ogg"]
        type:
          type: string
          description: MIME-тип с кодеком — для выбора файла плеером (`canPlayType`)
          examples: ['audio/mp4; codecs="mp4a.40.2"', 'audio/ogg; codecs="vorbis"', 'audio/ogg; codecs="opus"']
    SourceCitation:
      type: object
      description: Откуда взят текст (демо-контент из открытых источников — с указанием источника)
      required: [title]
      properties:
        title:
          type: string
          examples: ["Викисловарь"]
        url:
          type: string
          description: Ссылка на статью или запись источника
        locator:
          type: string
          description: Где именно в источнике (статья, номер предложения, страница)
        license:
          type: string
          description: Лицензия — как заявлена источником
    Week:
      type: object
      description: Учебная неделя пн–вс по Уфе (Asia/Yekaterinburg)
      required: [start, end]
      properties:
        start:
          type: string
          format: date
          description: Понедельник
        end:
          type: string
          format: date
          description: Воскресенье

    # ── learning ──
    UnitState:
      type: string
      enum: [open, locked]
    NodeKind:
      type: string
      description: "`lesson` — урок; `help_language` — «Помоги языку» (только дуэли); `place_test` — «Испытание места»"
      enum: [lesson, help_language, place_test]
    NodeState:
      type: string
      enum: [done, current, open, locked]
    RunKind:
      type: string
      description: |
        Вид забега — вид узла тропы (`NodeKind`), `review` — повторение слов (`POST /reviews/runs`) или `jump` —
        испытание для перехода к закрытому месту (`POST /units/{unitId}/jump-runs`)
      enum: [lesson, help_language, place_test, review, jump]
    ReviewDue:
      type: object
      description: Слова вызывающего, срок повторения которых наступил (по суткам Уфы)
      required: [due]
      properties:
        due:
          type: integer
          minimum: 0
          description: Сколько слов пора повторить (в забег повторения попадёт не больше 8)
    NodeIcon:
      type: string
      description: Иконка узла урока (Phosphor)
      enum: [star, chat-circle-text, book-open, barbell]
    Course:
      type: object
      required: [id, contentVersion, units]
      properties:
        id:
          type: string
          examples: [ba-ru]
        contentVersion:
          type: integer
          minimum: 1
          description: Версия импортированного контента (`content_versions`)
        units:
          type: array
          items:
            $ref: "#/components/schemas/CourseUnit"
        review:
          $ref: "#/components/schemas/ReviewDue"
        assignments:
          type: array
          description: |
            Задания учителя классам ученика, срок которых ещё не прошёл (сегодня по Уфе — последний день), по сроку.
            На класс — не больше двух. Просроченные ученику не показываются. Нет заданий или вызывающий не ученик —
            пустой список или поля нет.
          items:
            $ref: "#/components/schemas/StudentAssignment"
    CourseUnit:
      type: object
      required: [id, order, state, place, topicRu, nodes]
      properties:
        id:
          type: string
          examples: [01-ufa]
        order:
          type: integer
          minimum: 1
        state:
          $ref: "#/components/schemas/UnitState"
        place:
          $ref: "#/components/schemas/Place"
        topicRu:
          type: string
          examples: [Знакомство]
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TrailNode"
        jump:
          $ref: "#/components/schemas/PlaceJump"
    PlaceJump:
      type: object
      description: |
        Закрытое место можно открыть испытанием, не проходя уроки перед ним (`POST /units/{unitId}/jump-runs`). Поле
        есть, пока место закрыто: не все уроки перед ним пройдены, а юнит и все юниты перед ним открыты.
      required: [exerciseCount, mistakesAllowed]
      properties:
        exerciseCount:
          type: integer
          minimum: 1
          description: Сколько заданий в испытании
        mistakesAllowed:
          type: integer
          minimum: 0
          description: Сколько ошибок можно сделать, чтобы место открылось
    Place:
      type: object
      required: [slug, titleRu]
      properties:
        slug:
          type: string
          description: Ключ иллюстраций места (`place-<slug>-sign`, `place-<slug>-hero`, `deco-<slug>-*`)
          examples: [ufa]
        titleRu:
          type: string
          examples: [Уфа]
        titleBa:
          $ref: "#/components/schemas/BaString"
    TrailNode:
      type: object
      required: [id, kind, state, titleRu]
      properties:
        id:
          type: string
          description: Идентификатор узла — `lessonId` для `POST /lessons/{lessonId}/runs`
        kind:
          $ref: "#/components/schemas/NodeKind"
        state:
          $ref: "#/components/schemas/NodeState"
        titleRu:
          type: string
          examples: ["Привет!"]
        icon:
          $ref: "#/components/schemas/NodeIcon"
        exerciseCount:
          type: integer
          minimum: 0
          description: Сколько упражнений в уроке (у `help_language` — дуэлей); нет у узлов закрытого юнита
        completions:
          type: integer
          minimum: 0
          description: Сколько раз вызывающий прошёл узел
        passedByTest:
          type: boolean
          description: |
            Урок не проходился, а засчитан сданным испытанием для перехода: `state: done`, `completions: 0`. Поле есть
            только со значением `true`; пройденный потом урок его теряет
    StartLessonRunRequest:
      type: object
      additionalProperties: false
      required: [runId]
      properties:
        runId:
          type: string
          format: uuid
          description: Клиентский UUIDv7 забега; повтор с ним возвращает тот же забег
        accepts:
          type: array
          description: |
            Что клиент умеет показывать сверх базового набора упражнений. Без поля в забеге только базовые виды —
            клиенты, собранные раньше, не встретят незнакомый `type`. Повтор с тем же `runId` возвращает сохранённый
            забег, как бы ни было заполнено поле.
          uniqueItems: true
          maxItems: 10
          items:
            $ref: "#/components/schemas/RunFeature"
          examples: [[word_intro]]
    RunFeature:
      type: string
      description: "`word_intro` — карточки «Новое слово» перед упражнениями (`WordIntroExercise`)"
      enum: [word_intro]
    RunStatus:
      type: string
      enum: [active, completed]
    LessonRun:
      type: object
      required: [runId, lessonId, kind, titleRu, status, startedAt, exercises]
      properties:
        runId:
          type: string
          format: uuid
        lessonId:
          type: string
          description: Узел тропы; у повторения — `review`; у испытания для перехода (`jump`) — место (`CourseUnit.id`)
        kind:
          $ref: "#/components/schemas/RunKind"
        titleRu:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        startedAt:
          type: string
          format: date-time
        exercises:
          type: array
          description: Упражнения в порядке показа — без ключей ответов (карточки `word_intro` — вперемешку с ними, ответа не ждут)
          items:
            $ref: "#/components/schemas/RunExercise"
    RunExercise:
      description: Упражнение забега; вид — по полю `type`
      oneOf:
        - $ref: "#/components/schemas/TilesExercise"
        - $ref: "#/components/schemas/ChoiceExercise"
        - $ref: "#/components/schemas/FreeInputExercise"
        - $ref: "#/components/schemas/DuelExercise"
        - $ref: "#/components/schemas/MatchPairsExercise"
        - $ref: "#/components/schemas/WordIntroExercise"
      discriminator:
        propertyName: type
        mapping:
          tiles_ru_ba: "#/components/schemas/TilesExercise"
          choice_ba_ru: "#/components/schemas/ChoiceExercise"
          free_ru_ba: "#/components/schemas/FreeInputExercise"
          duel: "#/components/schemas/DuelExercise"
          match_pairs: "#/components/schemas/MatchPairsExercise"
          word_intro: "#/components/schemas/WordIntroExercise"
    WordIntroExercise:
      type: object
      description: |
        «Новое слово» — знакомство со словом урока перед упражнениями с ним: слово, перевод и запись носителя, если она
        есть (`word.audio`). Ответа нет: клиент показывает карточку и по «Дальше» идёт к следующему упражнению, попытку
        не отправляет. Мёд, точность и повторение карточка не меняет. Приходит только клиентам, которые попросили
        (`StartLessonRunRequest.accepts`). Слово и перевод — строки словаря курса (контент с источниками), не машинные.
      required: [id, type, review, word, translationRu]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [word_intro]
        review:
          $ref: "#/components/schemas/ReviewStatus"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceCitation"
        word:
          $ref: "#/components/schemas/BaString"
        translationRu:
          type: string
          examples: [школа]
    PromptHint:
      type: object
      description: |
        Подсказка к слову условия: слово подчёркнуто пунктиром, нажатие показывает перевод. Только из
        словаря курса — слово условия совпало с переводом слова словаря целиком (без угадывания форм). Подсказки идут
        по порядку в условии и не пересекаются. Подсказки на всё условие целиком (без учёта регистра и знаков) нет —
        иначе она выдала бы ответ. Открытую подсказку клиент сообщает в ответе (`AttemptRequest.hintsUsed`).
      required: [text, translation]
      properties:
        text:
          type: string
          description: Слово или фраза условия ровно как в `promptRu` (первое вхождение после предыдущей подсказки)
          examples: [школа]
        translation:
          $ref: "#/components/schemas/BaString"
    TilesExercise:
      type: object
      description: Собери перевод из плиток (плитки перемешаны, среди них — лишние)
      required: [id, type, review, promptRu, tiles]
      properties:
        id:
          type: string
          description: Идентификатор упражнения в забеге — `exerciseId` ответа
        type:
          type: string
          enum: [tiles_ru_ba]
        review:
          $ref: "#/components/schemas/ReviewStatus"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceCitation"
        promptRu:
          type: string
          examples: ["Я иду в школу."]
        hints:
          type: array
          description: Подсказки к словам `promptRu` (только в уроке); нет совпадений со словарём, «Испытание места» или повторение — поля нет
          maxItems: 12
          items:
            $ref: "#/components/schemas/PromptHint"
        tiles:
          type: array
          items:
            $ref: "#/components/schemas/Tile"
    Tile:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
          description: Непрозрачный идентификатор плитки в забеге
        text:
          type: string
          description: Башкирское слово (`lang="ba"`)
    ChoiceExercise:
      type: object
      description: Что значит это слово? — узнавание при первом знакомстве
      required: [id, type, review, prompt, options]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [choice_ba_ru]
        review:
          $ref: "#/components/schemas/ReviewStatus"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceCitation"
        prompt:
          type: string
          description: Башкирская строка (`lang="ba"`)
        promptAudio:
          $ref: "#/components/schemas/AudioClip"
        options:
          type: array
          items:
            $ref: "#/components/schemas/ChoiceOption"
    ChoiceOption:
      type: object
      required: [id, textRu]
      properties:
        id:
          type: string
          description: Непрозрачный идентификатор варианта в забеге
        textRu:
          type: string
    FreeInputExercise:
      type: object
      description: Напиши по-башкирски — клавиатура и панель букв
      required: [id, type, review, promptRu, letters]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [free_ru_ba]
        review:
          $ref: "#/components/schemas/ReviewStatus"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceCitation"
        promptRu:
          type: string
          examples: ["Спасибо!"]
        hints:
          type: array
          description: Подсказки к словам `promptRu` (только в уроке); нет совпадений со словарём, «Испытание места» или повторение — поля нет
          maxItems: 12
          items:
            $ref: "#/components/schemas/PromptHint"
        letters:
          type: array
          description: Буквы панели (особые буквы башкирского алфавита, строчные)
          items:
            type: string
          examples: [[ә, ө, ү, ғ, ҡ, ң, ҙ, ҫ, һ]]
    DuelExercise:
      type: object
      description: «Помоги языку» — какой перевод звучит естественнее? Ответ не оценивается
      required: [id, type, review, itemId, sourceRu, a, b]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [duel]
        review:
          $ref: "#/components/schemas/ReviewStatus"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceCitation"
        itemId:
          type: string
          format: uuid
          description: Исходник корпуса
        sourceRu:
          type: string
          examples: [Добрый день]
        a:
          type: string
          description: Вариант A (`lang="ba"`); стороны — в случайном порядке, запомненном в забеге
        b:
          type: string
          description: Вариант B (`lang="ba"`)
    MatchPairsExercise:
      type: object
      description: |
        «Пары» — соедини башкирские слова с переводами. Обе стороны перемешаны, `id` непрозрачны: какая пара верная,
        знает только сервер. Ответ — все пары сразу (`PairsAnswer`)
      required: [id, type, review, left, right]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [match_pairs]
        review:
          $ref: "#/components/schemas/ReviewStatus"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceCitation"
        left:
          type: array
          description: Башкирские слова (`lang="ba"`)
          minItems: 2
          maxItems: 5
          items:
            $ref: "#/components/schemas/PairWord"
        right:
          type: array
          description: Переводы
          minItems: 2
          maxItems: 5
          items:
            $ref: "#/components/schemas/PairTranslation"
    PairWord:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
          description: Непрозрачный идентификатор слова в забеге
        text:
          type: string
          description: Башкирское слово (`lang="ba"`)
        audio:
          $ref: "#/components/schemas/AudioClip"
    PairTranslation:
      type: object
      required: [id, textRu]
      properties:
        id:
          type: string
          description: Непрозрачный идентификатор перевода в забеге
        textRu:
          type: string
    PairLink:
      type: object
      additionalProperties: false
      required: [left, right]
      properties:
        left:
          type: string
          minLength: 1
          maxLength: 64
          description: "`id` из `left`"
        right:
          type: string
          minLength: 1
          maxLength: 64
          description: "`id` из `right`"
    PairMatch:
      type: object
      description: Верная пара «Пар» в ответе сервера
      required: [left, right]
      properties:
        left:
          type: string
        right:
          type: string
    DuelChoice:
      type: string
      description: "`a`, `b` — выбранный вариант; `both` — «Оба подходят»; `skip` — «Не знаю» (без мёда)"
      enum: [a, b, both, skip]
    AttemptRequest:
      type: object
      additionalProperties: false
      required: [attemptId, exerciseId, answer]
      properties:
        attemptId:
          type: string
          format: uuid
          description: Клиентский UUIDv7 попытки; повтор с ним возвращает тот же результат
        exerciseId:
          type: string
          minLength: 1
          maxLength: 100
        answer:
          $ref: "#/components/schemas/AttemptAnswer"
        latencyMs:
          type: integer
          minimum: 0
          maximum: 3600000
          description: Время от показа упражнения до ответа
        hintsUsed:
          type: integer
          minimum: 0
          maximum: 12
          description: |
            Сколько подсказок к условию (`hints`) ученик открыл до этого ответа; нет поля — 0. Ответ засчитывается как
            обычно (мёд, точность), но с подсказкой слово идёт в повторение не выше Hard (векторы
            `contracts/test-vectors/srs/rating.json`). Больше, чем подсказок у упражнения, не учитывается.
    AttemptAnswer:
      description: Ответ; вид — по полю `type` и должен подходить к упражнению
      oneOf:
        - $ref: "#/components/schemas/TilesAnswer"
        - $ref: "#/components/schemas/ChoiceAnswer"
        - $ref: "#/components/schemas/TextAnswer"
        - $ref: "#/components/schemas/DuelAnswer"
        - $ref: "#/components/schemas/PairsAnswer"
      discriminator:
        propertyName: type
        mapping:
          tiles: "#/components/schemas/TilesAnswer"
          choice: "#/components/schemas/ChoiceAnswer"
          text: "#/components/schemas/TextAnswer"
          duel: "#/components/schemas/DuelAnswer"
          pairs: "#/components/schemas/PairsAnswer"
    TilesAnswer:
      type: object
      additionalProperties: false
      required: [type, tileIds]
      properties:
        type:
          type: string
          enum: [tiles]
        tileIds:
          type: array
          description: Плитки в порядке, собранном учеником
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 64
    ChoiceAnswer:
      type: object
      additionalProperties: false
      required: [type, optionId]
      properties:
        type:
          type: string
          enum: [choice]
        optionId:
          type: string
          minLength: 1
          maxLength: 64
    TextAnswer:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
          minLength: 1
          maxLength: 300
    DuelAnswer:
      type: object
      additionalProperties: false
      required: [type, choice]
      properties:
        type:
          type: string
          enum: [duel]
        choice:
          $ref: "#/components/schemas/DuelChoice"
    PairsAnswer:
      type: object
      additionalProperties: false
      required: [type, pairs]
      properties:
        type:
          type: string
          enum: [pairs]
        pairs:
          type: array
          description: Все пары упражнения — каждое слово и каждый перевод ровно один раз (иначе 422 `pairs_incomplete`)
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/PairLink"
    Verdict:
      type: string
      description: |
        `correct` — верно; `almost` — верно с точностью до особой буквы (см. `hint`); `typo` — одна опечатка в длинном
        слове; `wrong` — неверно; `recorded` — голос в дуэли учтён (не оценивается). `almost` и `typo` засчитываются
        как верный ответ.
      enum: [correct, almost, typo, wrong, recorded]
    LetterHint:
      type: object
      description: «Почти! Обрати внимание на букву …» — первая буква, которой ответ отличается от верного
      required: [expected, got, token, index]
      properties:
        expected:
          type: string
          description: Нужная буква (строчная)
          examples: [ҡ]
        got:
          type: string
          description: Буква в ответе (строчная)
          examples: [к]
        token:
          type: integer
          minimum: 0
          description: Номер слова (с 0)
        index:
          type: integer
          minimum: 0
          description: Номер буквы в слове (с 0, в кодовых точках)
    AttemptResult:
      type: object
      required: [attemptId, exerciseId, verdict, firstAttempt, retry]
      properties:
        attemptId:
          type: string
          format: uuid
        exerciseId:
          type: string
        verdict:
          $ref: "#/components/schemas/Verdict"
        firstAttempt:
          type: boolean
          description: Это первая попытка по упражнению в забеге — по ней считается мёд
        retry:
          type: boolean
          description: Упражнение вернётся в конце урока («вернём в конце»)
        runEnded:
          type: boolean
          description: |
            Забег окончен досрочно: в испытании для перехода (`jump`) ошибок больше, чем можно. Клиент показывает ответ
            и сразу завершает забег (`POST /lesson-runs/{runId}/complete`), оставшихся упражнений не показывает. Поле
            есть только со значением `true`
        correctAnswer:
          $ref: "#/components/schemas/BaString"
        correctOptionId:
          type: string
          description: Верный вариант упражнения выбора
        meaningRu:
          type: string
          description: Перевод или толкование для листа обратной связи
        hint:
          $ref: "#/components/schemas/LetterHint"
        correctPairs:
          type: array
          description: «Пары» — верные пары (у `correct` совпадают с ответом)
          items:
            $ref: "#/components/schemas/PairMatch"
    HoneyBreakdown:
      type: object
      description: Мёд за урок (векторы `contracts/test-vectors/xp`)
      required: [total, base, firstTry, multiplier, pendingFromVotes]
      properties:
        total:
          type: integer
          minimum: 0
          description: Начислено за урок (`final`) — (base + firstTry) × multiplier с округлением вниз
        base:
          type: integer
          minimum: 0
          examples: [10]
        firstTry:
          type: integer
          minimum: 0
          description: +1 за каждое упражнение (кроме дуэлей), верное с первой попытки (`almost` и `typo` засчитываются)
        multiplier:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: "Множитель повтора урока за учебные сутки: 1 — первое прохождение, 0.5 — второе, 0 — с третьего. Других значений нет (`x-allowed-values`)"
          x-allowed-values: [1, 0.5, 0]
          examples: [1]
        pendingFromVotes:
          type: integer
          minimum: 0
          description: Мёд за голоса этого урока, который «созревает» (`pending`)
    StreakDayStatus:
      type: string
      description: "`done` — цель дня выполнена; `frozen` — день закрыт заморозкой; `missed` — пропуск; `today` — сегодня, цель ещё не выполнена; `future` — впереди"
      enum: [done, frozen, missed, today, future]
    StreakDay:
      type: object
      required: [date, status]
      properties:
        date:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/StreakDayStatus"
    StreakState:
      type: object
      description: Серия по суткам Уфы (векторы `contracts/test-vectors/streak`)
      required: [current, longest, freezes, extendedToday, today, week]
      properties:
        current:
          type: integer
          minimum: 0
        longest:
          type: integer
          minimum: 0
        freezes:
          type: integer
          minimum: 0
          maximum: 2
          description: Заморозки в запасе
        extendedToday:
          type: boolean
          description: Цель дня (1 урок) сегодня уже выполнена
        today:
          type: string
          format: date
          description: Сегодня по Уфе
        week:
          type: array
          description: Текущая неделя пн–вс
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/StreakDay"
    LessonRunSummary:
      type: object
      required: [runId, lessonId, honey, accuracy, durationSeconds, newWords, votes, streak]
      properties:
        runId:
          type: string
          format: uuid
        lessonId:
          type: string
        honey:
          $ref: "#/components/schemas/HoneyBreakdown"
        accuracy:
          type: number
          minimum: 0
          maximum: 1
          description: Доля упражнений (без дуэлей), верных с первой попытки
        durationSeconds:
          type: integer
          minimum: 0
        newWords:
          type: array
          items:
            $ref: "#/components/schemas/BaString"
        votes:
          type: integer
          minimum: 0
          description: Голосов в дуэлях этого урока
        streak:
          $ref: "#/components/schemas/StreakState"
        leagueResult:
          $ref: "#/components/schemas/LeagueResult"
        dailyGoal:
          $ref: "#/components/schemas/DailyGoal"
        dailyGoalReached:
          type: boolean
          description: Этот урок выполнил цель дня (до него она ещё не была выполнена) — маленькое празднование
        jump:
          $ref: "#/components/schemas/JumpResult"
        newAchievements:
          type: array
          description: |
            Награды, полученные этим забегом (до него их не было), — экран «Новая награда» сразу после итога. Нет поля
            или пусто — новых наград нет. Повтор `complete` возвращает тот же список
          items:
            $ref: "#/components/schemas/Achievement"
    JumpResult:
      type: object
      description: Итог испытания для перехода (забег `jump`) — есть только у него
      required: [unitId, passed, mistakes, mistakesAllowed]
      properties:
        unitId:
          type: string
          description: Место, к которому переходили (`CourseUnit.id`)
        passed:
          type: boolean
          description: Сдано — место и все места перед ним открыты. Не сдано — ничего не изменилось
        mistakes:
          type: integer
          minimum: 0
          description: Ошибок в испытании (неверные ответы; «почти» и опечатка ошибкой не считаются)
        mistakesAllowed:
          type: integer
          minimum: 0
    AchievementId:
      type: string
      description: |
        Награда набора (правила — векторы `contracts/test-vectors/achievements`). Набор расширяется: незнакомую награду
        клиент показывает по `titleRu`, `descriptionRu` и `icon` из ответа.
      x-extensible-enum:
        [first-lesson, perfect-lesson, streak-3, streak-7, streak-30, goal-7, words-10, words-50, first-vote, votes-10, first-place, all-places]
    AchievementIcon:
      type: string
      description: |
        Значок награды — иконка Phosphor в соте (`seal-check` — без ошибок, `map-pin` — место, `flag-banner` — вся тропа).
        Набор расширяется: незнакомый значок клиент заменяет звездой (`star`).
      x-extensible-enum: [footprints, seal-check, fire, target, book-open, books, scales, map-pin, flag-banner, star]
    Achievement:
      type: object
      description: |
        Награда ученика. Тексты одинаковы для всех клиентов и приходят с сервера. Получена — есть `earnedOn`;
        иначе прогресс к ней — `progress` из `target` («3 из 7»). У наград серии `progress` — текущая серия.
        Полученная награда не пропадает (кроме `all-places`: новое место в курсе снова делает её целью)
      required: [id, titleRu, descriptionRu, icon, progress, target]
      properties:
        id:
          $ref: "#/components/schemas/AchievementId"
        titleRu:
          type: string
          examples: ["7 дней подряд"]
        descriptionRu:
          type: string
          description: Что сделать, чтобы получить
          examples: ["Занимайся 7 дней подряд"]
        icon:
          $ref: "#/components/schemas/AchievementIcon"
        earnedOn:
          type: string
          format: date
          description: День получения по Уфе; нет — ещё не получена
        progress:
          type: integer
          minimum: 0
          description: Сколько сделано — не больше `target`; у полученной равно `target`
        target:
          type: integer
          minimum: 1
          description: Сколько нужно
    MyAchievements:
      type: object
      required: [earned, total, achievements]
      properties:
        earned:
          type: integer
          minimum: 0
          description: Сколько наград получено
        total:
          type: integer
          minimum: 0
        achievements:
          type: array
          description: Все награды набора в порядке показа
          items:
            $ref: "#/components/schemas/Achievement"

