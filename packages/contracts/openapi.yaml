  /api/v1/lesson-runs/{runId}/attempts:
    post:
      tags: [learning]
      operationId: submitLessonAttempt
      summary: Ответ на упражнение
      description: |
        Проверка — на сервере (`matchAnswer` из `@teletau/bashkir-text`, векторы `contracts/test-vectors/answer-check`):
        `correct`, `almost` (верно с точностью до особой буквы — `hint` с буквой и позицией), `typo` (одна опечатка
        в длинном слове), `wrong` (упражнение вернётся в конце урока, `retry: true`). Дуэль не оценивается: голос
        записывается в журнал (`ConsensusService.recordVote`), ответ — `recorded`, без распределения голосов
        (защита от конформизма). Мёд за урок считается по **первой** попытке каждого упражнения.

        `attemptId` генерирует клиент (UUIDv7): повтор с тем же `attemptId` возвращает тот же результат без повторной
        записи. Чужой или несуществующий забег — 404 (существование чужого забега не раскрывается). Упражнения нет
        в забеге — 422 `exercise_not_in_run`; вид ответа не подходит к упражнению — 422 `answer_type_mismatch` (у
        карточки `word_intro` ответа нет — любой ответ 422 `answer_type_mismatch`); забег завершён — 409 `run_completed`.
      x-access: { roles: [student, adult], policy: self }
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptRequest"
      responses:
        "200":
          description: Вердикт
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/lesson-runs/{runId}/complete:
    post:
      tags: [learning]
      operationId: completeLessonRun
      summary: Завершить урок — итог, мёд, серия, лига
      description: |
        Начисляет мёд за урок (векторы `contracts/test-vectors/xp`), засчитывает день серии (сутки по Уфе, векторы
        `streak`), добавляет очки в лигу и в квест класса. Повтор возвращает тот же итог без повторных начислений.
        Не на все упражнения есть ответ — 409 `run_incomplete` (карточкам `word_intro` ответ не нужен: на мёд, точность
        и повторение они не влияют). Чужой или несуществующий забег — 404.
        `leagueResult` — непросмотренный итог прошлой недели лиги (экран «Новая лига»), его отмечают
        `POST /leagues/result-seen`.

        Испытание для перехода (забег `jump`) — итог `jump`. Сдано (ошибок не больше `mistakesAllowed`) — мёд, сота
        цели дня и день серии как за «Испытание места», непройденные уроки перед местом засчитываются (`passedByTest`),
        их слова уходят в повторение. Не сдано — ничего не меняется: ни мёда, ни серии, ни отметок (`honey.total` 0).
        Испытание можно завершить досрочно, когда ошибок больше, чем можно (`AttemptResult.runEnded`), — тогда ответы
        нужны не на все упражнения.
      x-access: { roles: [student, adult], policy: self }
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Итог урока
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonRunSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Unexpected"

  /api/v1/units/{unitId}/jump-runs:
    post:
      tags: [learning]
      operationId: startJumpRun
      summary: Испытание для перехода — открыть место, не проходя уроки перед ним
      description: |
        Знающий может открыть закрытое место тропы сразу («Уже знаешь? Пройди испытание»): испытание из заданий
        «Испытаний места» непройденных мест перед ним, без подсказок и без повторов ошибок (`retry` всегда `false`).
        Доступно, пока у места в `GET /course` есть поле `jump`; иначе — 409 `jump_unavailable` (место уже открыто,
        это первое место или закрыт весь юнит). Нет такого места — 404.

        Ответы — `POST /lesson-runs/{runId}/attempts`, итог — `POST /lesson-runs/{runId}/complete` (поле `jump`).
        Ошибок больше, чем можно, — `AttemptResult.runEnded: true`: испытание не сдано, клиент сразу завершает забег.

        `runId` генерирует клиент (UUIDv7): повтор с тем же `runId` возвращает тот же забег (даже если место уже
        открылось). Тот же `runId` у другого места, урока или аккаунта — 409 `run_conflict`.
      x-access: { roles: [student, adult] }
      parameters:
