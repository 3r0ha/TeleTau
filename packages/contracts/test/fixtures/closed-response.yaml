openapi: 3.1.0
info: { title: fixture, version: 0.0.0 }
paths:
  /things:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: { name: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thing"
components:
  schemas:
    Thing:
      type: object
      properties:
        meta:
          $ref: "#/components/schemas/Meta"
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
    Meta:
      type: object
      additionalProperties: false
      properties: { version: { type: string } }
    Tag:
      allOf:
        - type: object
          additionalProperties: false
          properties: { label: { type: string } }
    OnlyInRequest:
      type: object
      additionalProperties: false
