# Осознанные исключения из правил линта контракта (с обоснованием).
openapi.yaml:
  # Локальный сервер в спецификации — намеренно: это внутренний API, прод-адрес задаётся окружением.
  no-server-example.com:
    - '#/servers/0/url'
  # Health-check не порождает клиентских ошибок 4xx: он либо 200, либо 503.
  operation-4xx-response:
    - '#/paths/~1api~1v1~1health/get/responses'
