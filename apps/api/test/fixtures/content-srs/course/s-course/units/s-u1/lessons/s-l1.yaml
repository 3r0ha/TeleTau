# Синтетический урок: выбор с записью, ввод, плитки фразы и «Пары». Шесть новых слов.
id: s-l1
unit: s-u1
kind: lesson
title_ru: Урок повторения один
new_words:
  - ҡалым
  - һөрөк
  - Пәләк тумә!
  - ғүзә
  - сәңер
  - ҙыйыр
exercises:
